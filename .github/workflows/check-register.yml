# Runs the tests and check-register on every push and pull request (spec #63 "Register check").
name: check-register

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-bump check diffs plugin/ against an earlier commit, so it needs the history.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Test
        run: bun test

      # Version base: the PR base on a pull request; the commit before the push on a push; the merge base
      # with the default branch for a new branch or a force push whose old tip is gone.
      - name: Pick the version base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || true)
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      - name: check-register
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VSTACK_BASE_REF: ${{ steps.base.outputs.ref }}
        run: bun scripts/check-register.ts --source github
