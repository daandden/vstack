name: check-register

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: ./node_modules/.bin/playwright-core install --with-deps --only-shell chromium

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Rebuild the Flow reader
        run: ./node_modules/.bin/vp run reader:build

      - name: Check the committed Flow reader is fresh
        run: |
          git add --intent-to-add plugin/skills/flow-page/reader
          git diff --exit-code --stat -- plugin/skills/flow-page/reader || {
            echo "plugin/skills/flow-page/reader is stale: run vp run reader:build and commit its output" >&2
            exit 1
          }

      - name: Test
        run: bun run test

      - name: Pick the change-note base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BRANCH: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base HEAD "origin/$PR_BRANCH")
          elif [ "$BRANCH" = "$DEFAULT_BRANCH" ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || true)
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      - name: check-register
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VSTACK_BASE_REF: ${{ steps.base.outputs.ref }}
        run: bun scripts/check-register.ts --source github
