    reason: "Settles End states from user words, the ticket, project default, then ask through live MCP discovery and Code host routing. The agent picks test seams by tdd's rule and asks only for a Costly seam (ADR 0062), and goes red per slice (#183, ADR 0035, ADR 0038). Preserves tune-llm-flow kept-round and eval commits (ADR 0041). Shared step 6b independently verifies committed HEAD at every End state and gates reached progress (ADR 0043). It owns Shared checkout briefs, REFUSED and cleanup_error availability checks, and unchanged-clone verification safety. Preserves supplied architecture agreements while leaving coding choices to implementation; consequential departures remain open until the user resolves them (#336, ADR 0053). Frontend tasks and delegated briefs conditionally reach good-css and its shipped UI guidance (#339, ADR 0051). The Conflict owner merges the target in and asks the user before resolving a hunk that chooses between behaviors (ADR 0033). Recovers run-owned clone preparation and stale branch state once while preserving proof, SHA guards, and the existing FAIL or DRIFT limit (#424, ADR 0070)."
