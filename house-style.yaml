rules:
  - id: fan-out-block
    scope: adapted
    text: |
      A step that would run two or more subagents at once uses a Fan-out block: a gate line that cites skill://vstack-fan-out (it holds the rubric and the judge cell; the step fills only `parts`, each with a countable size), one fan-out line, and one inline line. The exact forms are in plugin/skills/vstack-fan-out/FORMS.md, the single source every skill copies: the `task` batch; the isolated eval batch for roles that fan out in their own clones (hillclimb workers, wayfinder research runners, ship verifiers); and the inline line that stops when the skill forbids doing the work itself (today only ship).

      Every subagent prompt also carries the Scratch dir when the child writes Scratch.
    lint: >-
      In markdown outside frontmatter and code fences, a `Fan-out gate (` line reads `Fan-out gate (skill://vstack-fan-out): parts: …; size: …` and the next two non-blank lines are one fan-out line and one inline line. The fan-out line is one `task` call with `tasks[]`, or one eval cell of `agent(…, isolated=True, apply=False, merge=False)` calls with `wait()`; it names only vstack agents (agents the plugin ships) and passes the user's override words and the vstack root. The inline line does every part itself, or is a `Spawn one` line that stops when it cannot spawn. A fan-out or inline line with no gate line above it fails too (adapt, merge, and original text).
  - id: fixed-fan-out
    scope: adapted
    allowlist: [compare-attempts]
    text: |
      Only where invoking the skill is the user's request to fan out: the fixed Fan-out line in plugin/skills/vstack-fan-out/FORMS.md, with no gate line, no judge, and no inline line.
    lint: A `Fan-out (always` line in markdown outside frontmatter and code fences fails outside the allowlisted skills (adapt, merge, and original text).
  - id: single-spawn
    scope: adapted
    text: |
      One subagent uses a single-spawn line from plugin/skills/vstack-fan-out/FORMS.md: the `task` form, or the isolated eval form for a role that runs in its own clone. An isolated role never uses the `task` form, in a batch, an inline line, or a single spawn. If isolation is off, the skill stops and points at setup-vstack (ADR 0007).
    lint: >-
      In markdown outside frontmatter and code fences, a `Spawn one` line names one vstack agent (an agent the plugin ships) in both places, uses the `task` form or the eval form with isolated=True, apply=False, merge=False, and passes the user's override words and the vstack root. Any other line that names an agent through `agent: "…"` or `agent="…"` names a vstack agent, and an eval `agent()` call or a `task` call that names no agent fails. The class `agent-spawns` follows this rule too, for agent files whose `spawns:` lists `*` or an agent the plugin does not ship (adapt, merge, and original text).
  - id: headless-run
    scope: adapted
    allowlist: [skill-creator]
    text: |
      Headless batch (ADR 0010): one eval cell starts every run at once, with no cap. Per run: `omp -p --model <m> --thinking <t> --approval-mode yolo --cwd <run dir> --session-dir <run dir>/session <isolation> "<prompt>"`, where <m> and <t> are the last `model_change.model` and `thinking_level_change.thinkingLevel` in `$PI_SESSION_FILE`. If the user said "sequential" or "no fan-out", start them one at a time. If `omp` cannot run, stop: <reason>.

      <isolation>: with-skill and baseline runs use `--no-rules --config <run dir>/isolate.yml` (memory off; the overlay includes only the skills the run cites plus any staged competitors, and the run uses `--no-skills` when that list is empty; never `--no-extensions`, which also removes plugin agents). The comparator uses `--no-skills --no-rules --no-extensions` with memory off. Trigger runs add the origin project's skill directories to the overlay, the candidate description's directory first, with `*/<name>` ignored.

      A Headless run is a separate omp process, not a subagent, so it is not a spawn site.
    lint: A `Headless batch (` line or an `omp -p` command in markdown outside frontmatter and code fences fails outside the allowlisted skills (adapt, merge, and original text).
  - id: skill-ref
    scope: adapted
    text: |
      Text written for the agent names a skill as `skill://<name>`. Text that tells the user what to type uses `/skill:<name>`. omp built-ins (`/clear`, `/compact`, `/new`) stay as they are. Matt's `/handoff` becomes `/skill:handoff`.
    lint: A bare `/<vstack skill name>` token in markdown fails (adapt, merge, and original text). vstack skill names are the shipped skill directories plus the Upstream names of every skill and principle row that is not reject.
  - id: spawn-vocab
    scope: adapted
    allowlist: [writing-for-agents]
    text: |
      Spawn wording appears only in a single-spawn line (`Spawn one …`) or a Fan-out block (`Fan-out gate (…`). Cursor's spawn terms (`subagent_type`, `generalPurpose`, `Task` in backticks) never appear.
    lint: In markdown outside code fences, `subagent_type`, `generalPurpose`, or `Task` in backticks fails, and spawn or spin up outside inline code fails on a line that holds no `Spawn one `, `Fan-out gate (`, `Fan-out (always`, or `Headless batch (` (adapt, merge, and original text). Dispatch fails only when the same sentence names an agent, subagent, helper, worker, explorer, reviewer, designer, verifier, investigator, or runner; reducer and request dispatch are not delegation. A `spawns:` frontmatter key and words inside inline code are names, not wording, and a code fence quotes text instead of instructing. Allowlisted skills only describe spawning and are not linted.
  - id: worktree-cmd
    scope: adapted
    text: |
      Create a worktree through skill://vstack-worktree (`omp wt add …`, never `-q`). A parallel worker's tree is an isolated agent (ADR 0007), not a worktree. `/wt` appears only when telling the user how to move their own session. `git worktree remove`, `list`, and `prune` stay allowed.
    lint: 'A command matching git(\s+-C\s+\S+)?\s+worktree\s+add\s+[^\s`''"] fails in any text file (adapt, merge, and original text). Prose such as "never `git worktree add`" passes.'
  - id: tmp-path
    scope: adapted
    text: |
      Scratch lives at `~/.vstack/tmp/<repo-key>/<kind>/<entry>`, resolved by skill://vstack-tmp and passed to spawns as an absolute dir. An output location is never `$TMPDIR/`, `/tmp/`, or the OS temp directory. A temp file a script makes with `mktemp` and deletes itself is fine.
    lint: '`$TMPDIR/`, `/tmp/`, or "the OS temp directory" fails in any text file, except on a line that runs `mktemp` (adapt, merge, and original text).'
  - id: python-eval
    scope: adapted
    text: |
      diagram-design's `python3 scripts/<x>.py <args>` calls and export.md's Playwright probe run as eval cells that run the script with `runpy` under eval's interpreter (venv, then `~/.omp/python-env`, then PATH). Playwright is installed with `%pip` only after the user approves it through `ask`.
    lint: None; the Update's agent review applies it.
  - id: ask-tool
    scope: required
    text: |
      Every question the agent puts to the user during a session goes through omp's `ask` tool: confirmations, approvals, picks, and open questions. An open question is an `ask` whose options are the likely answers; the user types anything else through Other. Not covered: shell prompts in generated scripts, documents and comments written for other people, lesson quizzes, and `argument-hint` frontmatter.
      A subagent never asks: it returns each open question in its result, and the top-level agent asks it with `ask`. A Headless run has no `ask`: it takes the recommended answer and says so in its output.
      An answer omp picks itself when `ask.timeout` fires (marked `timedOut: true`) is never the user's answer. A gate (any confirmation or approval) asks once more; if that times out too, it stops without acting and says why. A grilling question stays open for the next round.
    lint: In markdown outside frontmatter and code fences, a sentence that holds one of `phrases` (whole words, any case) fails unless it names `ask` in backticks or the phrase follows don't, do not, never, or not. It runs over every artifact, adopt included. The Update's agent review catches asking wording the list misses.
    phrases:
      - ask the user
      - asks the user
      - asking the user
      - ask the human
      - ask them
      - ask for approval
      - ask for confirmation
      - ask for permission
      - confirm with
      - check with the user
      - get approval
      - get confirmation
      - get the user's approval
      - wait for approval
      - wait for confirmation
      - wait for the user
      - let them pick
      - let them choose
      - let the user pick
      - let the user choose
      - let the user decide
      - interview the user
      - grill the user
      - prompt the user
      - which one?
      - which is it?
      - which is right?
      - do you want
      - would you like
