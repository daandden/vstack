# House style (ADR 0008; spec #63 "House style"; #48, #58): the rows and rules that turn Upstream text into
# vstack text. Repo-level; it does not ship. scripts/lib/house-style.ts reads it for update-plan,
# setup-vstack's Migration copy, and check-register.
#
# replacements: list order is application order. Fields:
#   id        stable name
#   from, to  the Upstream phrase and the vstack phrase
#   match     literal: exact substring
#             name: `from` with no [\w-] character on either side (hyphenated names, file names)
#             ref: only /x, `x`, **x**, and skill://x (one-word names that are also English words)
#   upstream  a pins.yaml key | any. A row applies to artifacts that have a register row from that Upstream;
#             a merge artifact gets the rows of every Upstream it merges; an original gets every row except
#             one whose `from` is still a shipped skill name.
#   scope     required: every shipped artifact follows it, adopt included (an adopt item holding `from`
#             fails check-register, and the Update proposes switching it to adapt).
#             adapted: adapt, merge, and original text only; adopt items keep their Upstream wording.
#             Omitted on migration-only rows, which never run on Upstream text.
#   uses      update: update-plan runs it over both Upstream sides before `git merge-file`.
#             migration: setup-vstack's Migration runs it over project config, rule, domain, and private-store files;
#             plugin/skills/setup-vstack/references/house-style.yaml holds exactly these rows.
# A phrase gets a row only when it is blind-replaceable in its scope and recurs across items or Updates.
# One-off edits live in the artifact and survive the three-way merge.
#
# rules: applied by the agent. `text` is the rule; `lint` says what check-register enforces, if anything.
# `scope` works as for rows. `allowlist` names the only skills a form may appear in.

