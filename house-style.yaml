rules:
  - id: fan-out
    scope: adapted
    text: |
      A step that runs two or more subagents at once uses the one Fan-out line in plugin/skills/vstack-fan-out/FORMS.md, the single source every skill copies. The step always fans out. The line cites skill://vstack-fan-out, names its parts, and starts one subagent per part in one batch. It is the `task` batch, or the isolated eval batch for roles that fan out in their own clones (compare-attempts runners, hillclimb workers, implement-spec implementers, wayfinder research runners, final Verifiers). It ends with a stop clause. If its subagents cannot start, the step stops and names the parts that were not done and the reason.

      Every subagent prompt carries the vstack root, and also the Scratch dir when the child writes Scratch.
    lint: >-
      In markdown outside frontmatter and code fences, a line that holds `Fan-out (` or `Fan-out gate (` reads `Fan-out (skill://vstack-fan-out): parts: one per ….` It is one `task` call with `tasks[]`, or one eval cell of `agent(…, isolated=True, apply=False, merge=False)` calls that says `wait()` or no `wait()`. It names only vstack agents (agents the plugin ships), passes the vstack root, and ends with `If they cannot start, stop: …` or `If they cannot start or isolation is off, stop: …`. The removed judge-gated forms fail: a `Fan-out gate (` line, a `Fan-out (always` line, and a `- fan-out →` or `- inline →` branch line (adapt, merge, and original text).
  - id: single-spawn
    scope: adapted
    text: |
      One subagent uses a single-spawn line from plugin/skills/vstack-fan-out/FORMS.md: the `task` form, or the isolated eval form for a role that runs in its own clone. An isolated role uses the eval form in a Fan-out line and in a single spawn. If isolation is off, the skill stops and points at setup-vstack (ADR 0007). The line ends `If it cannot be spawned, stop: …`. Only compare-attempts' cross-judge ends `If it cannot be spawned, skip it: …` instead and records `cross-judge: not run`. In both cases the caller leaves the subagent's work undone.

      Every line naming vstack-verifier uses the isolated eval form, in a single-subagent line or a Fan-out line. A task form is unsafe even if the caller bypasses ship.
    lint: >-
      In markdown outside frontmatter and code fences, a `Spawn one` line names one vstack agent (an agent the plugin ships) in both places, uses the `task` form or the eval form with isolated=True, apply=False, merge=False, passes the vstack root, and ends with `If it cannot be spawned, stop: …`. A `skip it: …` ending passes only in compare-attempts, on a line that records `cross-judge: not run`. Any other line that names an agent through `agent: "…"` or `agent="…"` names a vstack agent, and an eval `agent()` call or a `task` call that names no agent fails. The `fan-out` lint reads Fan-out lines instead. The class `agent-spawns` follows this rule too, for agent files whose `spawns:` lists `*` or an agent the plugin does not ship (adapt, merge, and original text).
      Every call naming vstack-verifier requires eval `agent(…, agent="vstack-verifier", isolated=True, apply=False, merge=False)`. Task forms and unsafe isolation arguments fail, including in a Fan-out line.
  - id: headless-run
    scope: adapted
    allowlist: [skill-creator]
    text: |
      Headless batch (ADR 0010): one eval cell, or one bundled launcher script, starts every run at once, with no cap, before it awaits any run. Per run: `omp -p --model <m> --thinking <t> --approval-mode yolo --cwd <run dir> --session-dir <run dir>/session <isolation> "<prompt>"`, where <m> and <t> are the last `model_change.model` and `thinking_level_change.thinkingLevel` in `$PI_SESSION_FILE`. If `omp` cannot run, stop: <reason>.

      <isolation>: with-skill and baseline runs use `--no-rules --config <run dir>/isolate.yml` (memory off; the overlay includes only the skills the run cites plus any staged competitors, and the run uses `--no-skills` when that list is empty; never `--no-extensions`, which also removes plugin agents). The comparator uses `--no-skills --no-rules --no-extensions` with memory off. Trigger runs add the origin project's skill directories to the overlay, the candidate description's directory first, with `*/<name>` ignored.

      A Headless run is a separate omp process, not a subagent, so it is not a spawn site.
    lint: A `Headless batch (` line or an `omp -p` command in markdown outside frontmatter and code fences fails outside the allowlisted skills (adapt, merge, and original text).
  - id: skill-ref
    scope: adapted
    text: |
      Text written for the agent names a skill as `skill://<name>`. Text that tells the user what to type uses `/skill:<name>`. omp built-ins (`/clear`, `/compact`, `/new`) stay as they are. Matt's `/handoff` becomes `/skill:handoff`.
    lint: A bare `/<vstack skill name>` token in markdown fails (adapt, merge, and original text). vstack skill names are the shipped skill directories plus the Upstream names of every skill and principle row that is not reject.
  - id: spawn-vocab
    scope: adapted
    allowlist: [writing-for-agents]
    text: |
      Spawn wording appears only in a single-spawn line (`Spawn one …`) or a Fan-out line (`Fan-out (skill://vstack-fan-out)…`). Cursor's spawn terms (`subagent_type`, `generalPurpose`, `Task` in backticks) never appear.
    lint: In markdown outside code fences, `subagent_type`, `generalPurpose`, or `Task` in backticks fails, and spawn or spin up outside inline code fails on a line that holds no `Spawn one `, `Fan-out (skill://vstack-fan-out)`, or `Headless batch (` (adapt, merge, and original text). The `fan-out` lint reads every line that holds `Fan-out (` or `Fan-out gate (` instead. Dispatch fails only when the same sentence names an agent, subagent, helper, worker, explorer, reviewer, designer, verifier, investigator, or runner; reducer and request dispatch are not delegation. A `spawns:` frontmatter key and words inside inline code are names, not wording, and a code fence quotes text instead of instructing. Allowlisted skills only describe spawning and are not linted.
  - id: worktree-cmd
    scope: adapted
    text: |
      Create a worktree through skill://vstack-worktree (`omp wt add …`, never `-q`). A parallel worker's tree is an isolated agent (ADR 0007), not a worktree. `/wt` appears only when telling the user how to move their own session. `git worktree remove`, `list`, and `prune` stay allowed.
    lint: 'A command matching git(\s+-C\s+\S+)?\s+worktree\s+add\s+[^\s`''"] fails in any text file (adapt, merge, and original text). Prose such as "never `git worktree add`" passes.'
  - id: tmp-path
    scope: adapted
    text: |
      Scratch lives at `~/.vstack/tmp/<repo-key>/<kind>/<entry>`, resolved by skill://vstack-tmp and passed to spawns as an absolute dir. An output location is never `$TMPDIR/`, `/tmp/`, or the OS temp directory. A temp file a script makes with `mktemp` and deletes itself is fine.
    lint: '`$TMPDIR/`, `/tmp/`, or "the OS temp directory" fails in any text file, except on a line that runs `mktemp` (adapt, merge, and original text).'
  - id: ask-tool
    scope: required
    text: |
      Every question the agent puts to the user during a session goes through omp's `ask` tool: confirmations, approvals, picks, and open questions. An open question is an `ask` whose options are the likely answers; the user types anything else through Other. Not covered: Ratchet's `approve()` host dialog (ADR 0041), shell prompts in generated scripts, documents and comments written for other people, lesson quizzes, and `argument-hint` frontmatter.
      A subagent never asks: it returns each open question in its result, and the top-level agent asks it with `ask`. A Headless run has no `ask`: it takes the recommended answer and says so in its output.
      An answer omp picks itself when `ask.timeout` fires (marked `timedOut: true`) is never the user's answer. A gate (any confirmation or approval) asks once more; if that times out too, it stops without acting and says why. A grilling question stays open for the next round.
      Exception: clean-wt uses one multiselect cleanup approval question. Timeout, cancellation, or no selections keeps unresolved checkouts without a second question.
    lint: In markdown outside frontmatter and code fences, a sentence that holds one of `phrases` (whole words, any case) fails unless it names `ask` in backticks or the phrase follows don't, do not, never, or not. It runs over every artifact, adopt included. The Update's agent review catches asking wording the list misses.
    phrases:
      - ask the user
      - asks the user
      - asking the user
      - ask the human
      - ask them
      - ask for approval
      - ask for confirmation
      - ask for permission
      - confirm with
      - check with the user
      - get approval
      - get confirmation
      - get the user's approval
      - wait for approval
      - wait for confirmation
      - wait for the user
      - let them pick
      - let them choose
      - let the user pick
      - let the user choose
      - let the user decide
      - interview the user
      - grill the user
      - prompt the user
      - which one?
      - which is it?
      - which is right?
      - do you want
      - would you like
