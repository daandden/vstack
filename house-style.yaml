  # Migration-only rows: the relative private-storage forms, the specific one first. `docs-agents` is never
  # replaced as a bare word. Exact absolute <common> prefixes are generated per repo at plan time, not stored.
  - id: mig-config
    from: .git/matt-pocock/docs-agents
    to: .git/vstack/config
    match: literal
    upstream: any
