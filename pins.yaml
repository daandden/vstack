# Pins: the exact Upstream version vstack was last reconciled with (spec #63 "Upstreams and Pins").
# Keys are the register's `upstream` values and the clone names under ~/.cache/vstack/upstreams/<key>.
# repo: GitHub owner/name. path: the part of the repo vstack takes from ("" = whole repo).
# items: which tree entries at the Pin are Upstream items, each needing a register row. `match` is a path
# glob from the repo root (`*` stays inside one path segment); the first pattern that matches sets the kind.
upstreams:
  matt:
    role: Base
    repo: mattpocock/skills
    path: ""
    pin_kind: tag
    pin: v1.3.2
    items:
      - { match: "skills/*/*", type: tree, kind: skill }
  pstack:
    role: Enhancement
    repo: cursor/plugins
    path: pstack
    pin_kind: commit
    pin: 0b46ec399d55f2829e88822998f53b84944837d3
    items:
      - { match: "pstack/skills/principle-*", type: tree, kind: principle }
      - { match: "pstack/skills/*", type: tree, kind: skill }
      - { match: "pstack/skills/poteto-mode/playbooks/*.md", type: blob, kind: playbook }
      - { match: "pstack/agents/*.md", type: blob, kind: agent }
      - { match: "pstack/automations/*", type: tree, kind: agent }
  
  css:
    role: CSS
    repo: vojtaholik/good-css
    path: skills/good-css
    pin_kind: commit
    pin: 92d436ba1937d1b1407c47e35abb3e199eaace2e
    items:
      - { match: "skills/good-css", type: tree, kind: skill }
  
  emil:
    role: UI
    repo: emilkowalski/skills
    path: skills
    pin_kind: commit
    pin: 64eb3deb9a5fbfa041faf783e0bc3fd635872e9c
    items:
      - { match: "skills/*", type: tree, kind: skill }
