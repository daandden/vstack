<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Flow: {{title}}</title>
  <!-- META -->
  <style>
    *, *::before, *::after { box-sizing: border-box; min-inline-size: 0; }
    :root {
      color-scheme: dark;
      --base: oklch(24.3% 0.030 283.9);
      --mantle: oklch(21.6% 0.025 284.1);
      --surface0: oklch(32.4% 0.032 282.0);
      --surface1: oklch(40.4% 0.032 280.2);
      --overlay0: oklch(55.0% 0.034 277.1);
      --subtext0: oklch(75.1% 0.040 273.9);
      --subtext1: oklch(81.7% 0.040 272.9);
      --text: oklch(87.9% 0.043 272.3);
      --mauve: oklch(78.7% 0.119 304.8);
      --blue: oklch(76.6% 0.111 259.9);
      --lavender: oklch(81.7% 0.091 277.3);
      --yellow: oklch(91.9% 0.070 86.5);
      --peach: oklch(82.4% 0.101 52.6);
      --green: oklch(85.8% 0.109 142.7);
      --red: oklch(75.6% 0.130 2.8);
      --teal: oklch(85.8% 0.079 182.7);
      --pink: oklch(87.0% 0.075 336.3);
      --line: color-mix(in oklch, var(--surface1) 60%, transparent);
      scrollbar-gutter: stable;
      --nav-clearance: 5rem;
      scroll-padding-block-start: var(--nav-clearance);
      --fs-title: 0.9375rem;
      --fs-body: 0.8125rem;
      --fs-small: 0.75rem;
      text-wrap: pretty;
      overflow-wrap: break-word;
      font-synthesis: none;
    }
    [data-state="picked"], [data-state="written"] { --state: var(--yellow); }
    [data-state="resolved"] { --state: var(--teal); }
    [data-state="unresolved"] { --state: var(--red); }
    [data-state="open"], [data-state="retired"] { --state: var(--overlay0); }
    [data-state="finished"] { --state: var(--green); }
    [data-state="in-progress"] { --state: var(--peach); }
    [data-state="not-started"] { --state: var(--overlay0); }
    [data-state="closed"] { --state: var(--green); }
    [data-state="reopened"] { --state: var(--peach); }
    [hidden] { display: none !important; }
    body { margin: 0; min-block-size: 100svh; background: var(--base); color: var(--text); font: var(--fs-body)/normal "IosevkaTerm Nerd Font Mono", "Iosevka Term", "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0; }
    h1, h2, h3, h4 { margin-block: 0; color: var(--text); text-wrap: balance; font-family: "IosevkaTermSlab Nerd Font Mono", "Iosevka Term Slab", "JetBrains Mono", ui-monospace, monospace; font-size: var(--fs-body); line-height: normal; }
    p, ul, ol, dl, dd, figure { margin: 0; }
    a { color: var(--blue); text-underline-offset: 0.2em; touch-action: manipulation; }
    a:active, .terms dt a:active { color: var(--lavender); }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 0.2em; }
    @media (hover: hover) and (pointer: fine) { a:hover, .terms dt a:hover { color: var(--lavender); } }
    code, pre { font: inherit; }
    code { padding-inline: 0.25em; border-radius: 0.2rem; background: var(--surface0); color: var(--text); }
    pre { white-space: pre-wrap; font-size: var(--fs-small); }
    svg, img, video { display: block; max-inline-size: 100%; block-size: auto; }
    .prototype-viewer { display: block; inline-size: 100%; block-size: auto; aspect-ratio: 16 / 9; border: 1px solid var(--line); background: var(--mantle); }

    .bar { position: sticky; inset-block-start: 0; z-index: 1; background: var(--mantle); border-block-end: 1px solid var(--line); font-size: var(--fs-small); }
    .tabs, .jump-row { display: flex; gap: 0.25rem 0.75rem; align-items: center; padding-block: 0.375rem; padding-inline: 1.25rem; }
    .tablist, .jump-row { flex-wrap: wrap; }
    .tablist { display: flex; flex: 1; gap: 0.25rem 0.75rem; align-items: center; }
    .jump-row { border-block-start: 1px solid var(--line); }
    .tabs a, .jump-row a { display: inline-flex; gap: 0.375rem; align-items: center; padding-inline: 0.25rem; border-radius: 0.25rem; color: var(--subtext1); text-decoration: none; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tabs a[aria-selected="true"], .jump-row a[aria-current="true"] { background: var(--surface1); color: var(--mauve); }
    .jump-row .sep { inline-size: 1px; block-size: 1rem; background: var(--surface1); }
    .dot { flex: none; inline-size: 0.4375rem; block-size: 0.4375rem; border-radius: 50%; background: var(--state, var(--overlay0)); }
    .tree-open, .stage-tree form button { display: inline-flex; flex: none; gap: 0.375rem; align-items: center; padding-block: 0.125rem; padding-inline: 0.5rem; border: 1px solid var(--surface1); border-radius: 0.25rem; background: var(--surface0); color: var(--subtext1); font: inherit; font-weight: 600; touch-action: manipulation; cursor: pointer; }
    .tree-open:active, .stage-tree form button:active, .tree a:active { background: var(--surface1); color: var(--lavender); }
    @media (hover: hover) and (pointer: fine) { :is(.tree-open, .stage-tree form button, .tree a):hover { color: var(--lavender); } }
    kbd { padding-inline: 0.25em; border-radius: 0.2rem; background: var(--mantle); color: var(--subtext0); font: inherit; }
    .stage-tree { inline-size: min(40rem, 100% - 2rem); max-block-size: min(40rem, 100% - 2rem); padding: 0; border: 1px solid var(--surface1); border-radius: 0.5rem; background: var(--mantle); color: var(--text); }
    .stage-tree::backdrop { background: color-mix(in oklch, var(--base) 70%, transparent); }
    .stage-tree > header { display: flex; gap: 0.75rem; align-items: center; justify-content: space-between; padding-block: 0.5rem; padding-inline: 1rem; border-block-end: 1px solid var(--line); }
    .stage-tree h2 { color: var(--text); }
    .tree, .tree ul { display: grid; gap: 0.25rem; margin: 0; padding-inline-start: 0; list-style: none; }
    .tree { padding-block: 0.75rem; padding-inline: 1rem; }
    .tree ul { margin-block-start: 0.25rem; margin-inline-start: 0.25rem; padding-inline-start: 1rem; border-inline-start: 1px solid var(--surface1); }
    .tree li { display: grid; grid-template-columns: auto 1fr; gap: 0 0.75rem; align-items: baseline; }
    .tree li > ul { grid-column: 1 / -1; }
    .tree a { display: inline-flex; gap: 0.5rem; align-items: center; color: var(--mauve); font-weight: 600; text-decoration: none; }
    .tree .meta { display: inline-flex; flex-wrap: wrap; gap: 0 0.75rem; color: var(--subtext0); font-size: var(--fs-small); }
    .tree .state { color: var(--state); font-weight: 600; }

    main { --content: 100rem; --gutter: 1.25rem; display: grid; grid-template-columns: [full-start] minmax(var(--gutter), 1fr) [content-start] min(calc(100% - var(--gutter) * 2), var(--content)) [content-end] minmax(var(--gutter), 1fr) [full-end]; gap: 1.5rem 0; padding-block: 1rem; }
    main > * { grid-column: content; }
    .stage .pick { color: var(--yellow); }
    .stage .read { color: var(--teal); }
    .stage .open { color: var(--overlay0); }
    .sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: clip; clip-path: inset(50%); white-space: nowrap; }
    /* A box that scrolls sideways is the containing block of its screen-reader text, so that text stays inside the
       box and cannot widen the page on a narrow pane. */
    .visual, .preview, .result .table, .code pre { position: relative; }
    .page-head { display: grid; gap: 0.25rem; }
    .lifecycle { color: var(--state); font-size: var(--fs-small); font-weight: 600; }
    .crumb, time, .label { color: var(--subtext0); }
    .crumb, time, .label, .why { font-size: var(--fs-small); }
    h1 { font-size: var(--fs-title); font-weight: 700; }

    .tab, .round { display: grid; gap: 1.5rem; }
    .empty { color: var(--subtext0); }
    .lineage { display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem; padding-inline-start: 0; list-style: none; }
    .lineage a { font-weight: 600; text-decoration: none; }
    .lineage .label { margin-inline-end: 0.5rem; font-weight: 600; }

    .stages { display: grid; gap: 1rem; padding-inline-start: 0; list-style: none; }
    .stage { display: grid; gap: 0.375rem; padding-block-end: 0.75rem; border-block-end: 1px solid var(--line); }
    .stage h3 { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; }
    .stage h3 a { display: inline-flex; gap: 0.5rem; align-items: center; color: var(--mauve); text-decoration: none; }
    .stage .meta { display: inline-flex; gap: 0.75rem; font-size: var(--fs-small); font-weight: 400; color: var(--subtext0); }
    .stage .meta .state { color: var(--state); font-weight: 600; }
    .stage .label { font-weight: 600; }
    .stage ul { display: grid; gap: 0.125rem; padding-inline-start: 1.25rem; }
    .stage li::marker { color: var(--overlay0); }
    .stage li a { font-weight: 600; text-decoration: none; }

    .background { display: grid; gap: 0.625rem; }
    .background > header { display: grid; gap: 0.125rem; }
    .background > header .label { font-weight: 600; text-transform: uppercase; }
    .background h2 { font-size: var(--fs-title); font-weight: 700; text-transform: none; color: var(--text); }
    .background section { display: grid; gap: 0.375rem; }
    .background h3 { font-size: var(--fs-body); color: var(--lavender); }
    .summary-line { color: var(--subtext1); }
    .sources { display: grid; gap: 0.125rem; }
    .sources .label { font-weight: 600; }

    .topic { display: grid; gap: 0.5rem; padding-block-end: 0.75rem; border-block-end: 1px solid var(--line); }
    .topics { display: grid; gap: 0.125rem; }
    .topics a { font-weight: 600; text-decoration: none; }

    .round > header { display: grid; gap: 0.125rem; padding-block-start: 0.5rem; border-block-start: 1px solid var(--surface1); }
    h2 { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; font-size: var(--fs-small); font-weight: 650; text-transform: uppercase; color: var(--subtext0); }
    h2 time { font-weight: 400; text-transform: none; font-variant-numeric: tabular-nums; }

    .question { display: grid; gap: 0.625rem; padding-block-end: 0.5rem; border-block-end: 1px solid var(--line); }
    h3 { font-size: var(--fs-title); font-weight: 650; color: var(--mauve); }
    .qnum { margin-inline-end: 0.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .description { display: grid; gap: 0.5rem; }
    .bullets { display: grid; gap: 0.125rem; padding-inline-start: 1.25rem; }
    .bullets > li::marker { color: var(--overlay0); }
    .example, .needs, .today, .terms, .result-links { display: grid; gap: 0.125rem; }
    :is(.example, .needs, .today, .terms, .topics, .result-links) > .label { font-weight: 600; color: var(--pink); }
    .source { color: var(--subtext0); font-size: var(--fs-small); }
    .terms dl, .fields { display: grid; gap: 0.125rem; }
    .terms dt { font-weight: 600; color: var(--teal); }
    .terms dt :is(code, a) { color: inherit; }
    .fields dt { font-size: var(--fs-small); font-weight: 600; color: var(--subtext1); }
    :is(.terms dl, .fields) > dd + dt { margin-block-start: 0.5rem; }
    .example p:not(.label) { white-space: pre-wrap; }

    .visual, .preview { padding-block: 0.625rem; padding-inline: 0.75rem; border-radius: 0.375rem; background: var(--mantle); overflow-x: auto; }
    .visual { display: grid; gap: 0.5rem; }
    .preview { display: grid; gap: 0.375rem; justify-items: start; }
    [data-flow-target] { display: none; }

    .options { display: grid; padding-inline-start: 0; list-style: none; }
    .option { display: grid; gap: 0.25rem; padding-block: 0.5rem; }
    h4 { font-weight: 400; color: var(--blue); }
    .option[data-picked] h4 { color: var(--yellow); font-weight: 700; }
    .star { margin-inline-start: 0.5rem; color: var(--yellow); font-weight: 700; }
    .trade { display: grid; padding-inline-start: 0; list-style: none; }
    .trade > li { position: relative; padding-inline-start: 1.25rem; }
    .gain::before, .cost::before { position: absolute; inset-inline-start: 0; font-weight: 700; }
    .gain::before { content: "+"; color: var(--green); }
    .cost::before { content: "\2212"; color: var(--red); }
    .why { color: var(--subtext0); }

    .answer { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; color: var(--text); }
    .answer > .label { font-weight: 600; color: var(--state); }

    .summary { display: grid; gap: 0.5rem; }
    .decisions { display: grid; gap: 0.25rem; padding-inline-start: 1.25rem; }
    .decisions > li::marker { color: var(--overlay0); }
    .decisions a { font-weight: 600; text-decoration: none; }

    .result { display: grid; gap: 0.75rem; }
    .result > header { display: grid; gap: 0.25rem; padding-block-start: 0.5rem; border-block-start: 1px solid var(--surface1); }
    .result-summary { color: var(--subtext1); }
    .result .entries { display: grid; gap: 0.75rem; padding-inline-start: 0; list-style: none; }
    .card, .claim { display: grid; gap: 0.375rem; padding-block-end: 0.5rem; border-block-end: 1px solid var(--line); }
    .card:last-child, .claim:last-child { padding-block-end: 0; border-block-end: none; }
    .entry-id { margin-inline-end: 0.5rem; font-weight: 700; font-variant-numeric: tabular-nums; text-transform: uppercase; }
    .result-links .entry-id { margin-inline-end: 0; }
    .tag { color: var(--subtext0); font-size: var(--fs-small); font-weight: 600; }
    .card[data-blocking] .tag { color: var(--red); }
    .card .evidence > summary { inline-size: fit-content; font-size: var(--fs-small); font-weight: 600; color: var(--subtext1); cursor: pointer; touch-action: manipulation; }
    .card .evidence > summary:active { color: var(--lavender); }
    .card .evidence[open] > summary { margin-block-end: 0.125rem; }
    [data-status="confirmed"] { --state: var(--red); }
    [data-status="cleared"] { --state: var(--green); }
    [data-status="unproven"] { --state: var(--peach); }
    .claim .tag { color: var(--state); }
    .result .ask { display: grid; gap: 0.125rem; }
    .result .ask .label { font-weight: 600; }
    .result .ask a, .result td a { font-weight: 600; text-decoration: none; }
    .result .table { overflow-x: auto; }
    .result table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .result th, .result td { padding-block: 0.25rem; padding-inline: 0.5rem; border-block-end: 1px solid var(--line); text-align: start; vertical-align: top; }
    .result th { color: var(--subtext0); font-size: var(--fs-small); font-weight: 600; }
    .card:target, .claim:target, .result tr:target { background: var(--surface0); }

    .provenance { color: var(--subtext0); font-size: var(--fs-small); }
    .document { display: grid; gap: 1rem; }
    .doc-section { display: grid; gap: 0.625rem; }
    .doc-section h3 { color: var(--lavender); }
    .doc-section:target, .citations li:target { background: var(--surface0); }
    .code { display: grid; gap: 0.25rem; }
    .code pre { margin: 0; padding-block: 0.5rem; padding-inline: 0.75rem; border-radius: 0.375rem; background: var(--mantle); white-space: pre; overflow-x: auto; tab-size: 4; }
    .code code { padding-inline: 0; background: none; }
    .code-entry { display: grid; gap: 0.5rem; }
    .code-location { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.75rem; color: var(--subtext0); font-size: var(--fs-small); }
    .code-location .kind { color: var(--teal); font-weight: 600; }
    .code-location .entry-id { margin-inline-end: 0; }
    .code[data-kind] pre { padding-inline: 0; }
    .code[data-kind] code { display: block; inline-size: max-content; min-inline-size: 100%; }
    .code .line { display: block; position: relative; padding-inline: 4.5rem 0.75rem; min-block-size: 1lh; }
    .code .line::before { content: attr(data-old); position: absolute; inset-block-start: 0; inset-inline-start: 0; inline-size: 3.5rem; padding-inline-end: 0.75rem; color: var(--subtext0); text-align: end; user-select: none; font-variant-numeric: tabular-nums; }
    .code[data-kind="diff"] .line { padding-inline-start: 8rem; }
    .code[data-kind="diff"] .line::after { content: attr(data-new); position: absolute; inset-block-start: 0; inset-inline-start: 3.5rem; inline-size: 3.5rem; padding-inline-end: 0.75rem; color: var(--subtext0); text-align: end; user-select: none; font-variant-numeric: tabular-nums; }
    .code .add { background: color-mix(in oklch, var(--green) 10%, var(--mantle)); }
    .code .del { background: color-mix(in oklch, var(--red) 10%, var(--mantle)); }
    .code .add .mark { color: var(--green); }
    .code .del .mark { color: var(--red); }
    .code :is(.meta, .note) { color: var(--subtext0); }
    .code .hunk { color: var(--lavender); background: var(--surface0); }
    .code .line:target, .code .line:has(:target) { outline: 1px solid var(--yellow); outline-offset: -1px; }
    .tok-kw { color: var(--mauve); }
    .tok-str { color: var(--green); }
    .tok-com { color: var(--subtext0); font-style: italic; }
    .tok-num { color: var(--peach); }
    .code .tok-ws { background: color-mix(in oklch, var(--peach) 25%, transparent); }

    .timeline { display: grid; padding-inline-start: 1rem; list-style: decimal; }
    .event { padding-block: 0 1rem; padding-inline-start: 0.75rem; border-inline-start: 1px solid var(--line); }
    .event > * + * { margin-block-start: 0.375rem; }
    .event-meta { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; color: var(--subtext0); font-size: var(--fs-small); font-variant-numeric: tabular-nums; }
    .event .outcome { color: var(--outcome); font-weight: 600; }
    .event::marker { color: var(--outcome); font-variant-numeric: tabular-nums; }
    .event[data-outcome="succeeded"] { --outcome: var(--green); }
    .event[data-outcome="failed"] { --outcome: var(--red); }
    .event[data-outcome="blocked"] { --outcome: var(--peach); }
    .event[data-outcome="skipped"], .event[data-outcome="unknown"] { --outcome: var(--subtext0); }
    .event[data-outcome="noted"] { --outcome: var(--blue); }
    .event:target { background: var(--surface0); }

    .cite { font-size: var(--fs-small); font-weight: 600; text-decoration: none; font-variant-numeric: tabular-nums; }
    .backlink { font-size: var(--fs-small); }
    :is(.limitations, .citations) { display: grid; gap: 0.125rem; }
    :is(.limitations, .citations) > .label { font-weight: 600; }
    .limitations > .label { color: var(--peach); }

    .attachments { display: grid; gap: 0.75rem; }
    .attachments > .label { font-weight: 600; }
    .attachment { display: grid; gap: 0.375rem; justify-items: start; padding-block: 0.625rem; padding-inline: 0.75rem; border-radius: 0.375rem; background: var(--mantle); }
    .attachment img, .attachment video { border-radius: 0.25rem; background: var(--surface0); }
    .attachment figcaption { display: grid; gap: 0.125rem; }
    .attachment-meta { display: flex; flex-wrap: wrap; gap: 0.125rem 0.75rem; color: var(--subtext0); font-size: var(--fs-small); }
    .attachment-meta .kind { font-weight: 600; color: var(--teal); }
    .attachment[data-availability="unavailable"] .attachment-meta .kind { color: var(--red); }
    .attachment[data-availability="external"] .attachment-meta .kind { color: var(--peach); }
    .unavailable, .download { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; }
    .unavailable > .label { font-weight: 600; color: var(--red); }
    .launch { display: grid; gap: 0.25rem; }
    .launch > .label { font-weight: 600; }
    .revisions > summary { inline-size: fit-content; font-size: var(--fs-small); font-weight: 600; color: var(--subtext1); cursor: pointer; touch-action: manipulation; }
    .revisions > summary:active { color: var(--lavender); }
    .revisions[open] > summary { margin-block-end: 0.75rem; }
    .revisions > .result { padding-inline-start: 0.75rem; border-inline-start: 2px solid var(--surface1); }

    [data-task="done"], [data-check="passed"], [data-pr="merged"] { --state: var(--green); }
    [data-task="active"], [data-check="pending"], [data-pr="open"] { --state: var(--peach); }
    [data-task="pending"], [data-task="skipped"], [data-task="inapplicable"], [data-pr="closed"] { --state: var(--overlay0); }
    [data-check="failed"], [data-blocked] { --state: var(--red); }
    .progress { display: grid; gap: 0.75rem; padding: 0.75rem; border: 1px solid var(--surface1); border-radius: 0.375rem; background: var(--mantle); }
    .progress > header { display: grid; gap: 0.25rem; }
    .progress .verdict { font-weight: 600; color: var(--peach); }
    .progress[data-complete] .verdict { color: var(--green); }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 0.5rem 1.5rem; }
    .facts dt { font-size: var(--fs-small); font-weight: 600; color: var(--subtext0); }
    .facts dd { font-variant-numeric: tabular-nums; }
    .progress .tag { color: var(--state); }
    .blockers { display: grid; gap: 0.125rem; }
    .blockers > .label { font-weight: 600; color: var(--red); }
    .tasks { display: grid; gap: 0.375rem; padding-inline-start: 0; list-style: none; }
    .task { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; }
    .task > .tag { min-inline-size: 7em; }
    .task[data-task="skipped"], .task[data-task="inapplicable"] { color: var(--subtext0); }
    .task .blocked { color: var(--red); font-size: var(--fs-small); font-weight: 600; }
    .task :is(.reason, .evidence, .resolved) { flex-basis: 100%; }
    @media (min-width: 40rem) { .task :is(.reason, .evidence, .resolved) { margin-inline-start: calc(7em + 0.75rem); } }
    .progress .evidence > summary { inline-size: fit-content; font-size: var(--fs-small); font-weight: 600; color: var(--subtext1); cursor: pointer; touch-action: manipulation; }
    .task:target { background: var(--surface0); }
    .demo { display: grid; gap: 0.625rem; justify-items: start; padding-block: 0.625rem; padding-inline: 0.75rem; border-radius: 0.375rem; background: var(--mantle); }
    .demo-now { display: grid; gap: 0.375rem; }
    .demo-state { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; }
    .demo-state > .label { font-weight: 600; }
    .demo-state > strong { color: var(--mauve); font-size: var(--fs-title); }
    .demo-values dd { font-variant-numeric: tabular-nums; color: var(--teal); }
    .demo-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .demo-actions button { padding-block: 0.25rem; padding-inline: 0.625rem; border: 1px solid var(--surface1); border-radius: 0.25rem; background: var(--surface0); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; touch-action: manipulation; }
    .demo-actions button:active { background: var(--surface1); }
    .demo-actions button:is(:disabled, [aria-disabled="true"]) { color: var(--overlay0); border-style: dashed; cursor: not-allowed; }
    .demo-actions .demo-reset { background: none; color: var(--subtext1); }
    @media (hover: hover) and (pointer: fine) { .demo-actions button:not(:disabled, [aria-disabled="true"]):hover { border-color: var(--lavender); } }
    .demo-rules > summary { inline-size: fit-content; font-size: var(--fs-small); font-weight: 600; color: var(--subtext1); cursor: pointer; touch-action: manipulation; }
    .demo-rules[open] > summary { margin-block-end: 0.375rem; }
    .demo-rules { display: grid; gap: 0.375rem; }

    .comparison, .metrics, .measurement { display: grid; gap: 0.75rem; }
    .comparison > .verdict { display: grid; gap: 0.25rem; padding-block: 0.5rem; padding-inline: 0.75rem; border-inline-start: 2px solid var(--state); border-radius: 0.25rem; background: var(--mantle); }
    .comparison > .verdict > .label { font-weight: 600; }
    .verdict-line { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; }
    .verdict-line .tag { color: var(--state); }
    .verdict-line a { font-weight: 700; text-decoration: none; }
    [data-outcome="chosen"] { --state: var(--green); }
    [data-outcome="tie"] { --state: var(--lavender); }
    [data-outcome="inconclusive"] { --state: var(--peach); }
    .compare th[scope="col"][data-chosen] { color: var(--green); }
    .compare th[scope="row"] { color: var(--text); font-size: var(--fs-body); }
    .compare :is(th, td) { min-inline-size: 10rem; }
    .compare td .description { gap: 0.25rem; }
    .gap { color: var(--overlay0); font-weight: 600; }
    .compare :is(th, td):target, .measurement tr:target { background: var(--surface0); }
    .side > .label a { font-weight: 600; text-decoration: none; }

    .measurement h3 { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; color: var(--lavender); }
    .measurement h3 .label { font-weight: 400; }
    [data-verdict="better"] { color: var(--green); }
    [data-verdict="worse"] { color: var(--red); }
    [data-verdict="no-difference"], [data-verdict="inconclusive"] { color: var(--peach); }
    .measurement th[scope="row"] { color: var(--text); font-size: var(--fs-body); font-weight: 400; white-space: nowrap; }
    .measurement td { white-space: nowrap; }
    .bar-cell { display: inline-flex; gap: 0.5rem; align-items: center; }
    .bar-cell .num { min-inline-size: 7ch; text-align: end; font-variant-numeric: tabular-nums; }
    .bar-cell meter { appearance: none; inline-size: 6rem; block-size: 0.5rem; border: none; border-radius: 0.25rem; background: var(--surface0); }
    .bar-cell meter::-webkit-meter-bar { border: none; border-radius: 0.25rem; background: var(--surface0); block-size: 0.5rem; }
    .bar-cell meter::-webkit-meter-optimum-value { border-radius: 0.25rem; background: var(--blue); }
    .bar-cell meter::-moz-meter-bar { border-radius: 0.25rem; background: var(--blue); }
    .quiz, .quiz form, .quiz fieldset { display: grid; gap: 0.75rem; }
    .quiz form { padding-block: 1rem; border-block-end: 1px solid var(--surface1); }
    .quiz fieldset { border: 0; padding: 0; min-inline-size: 0; }
    .quiz legend { font-weight: 600; margin-block-end: 0.75rem; }
    .quiz label { display: flex; align-items: center; gap: 0.5rem; min-block-size: 2.75rem; flex-wrap: wrap; }
    .quiz input:not([type="radio"]) { font: inherit; color: var(--text); background: var(--surface0); border: 1px solid var(--overlay0); border-radius: 0.25rem; padding: 0.5rem; inline-size: min(100%, 20rem); }
    .quiz button { font: inherit; justify-self: start; min-block-size: 2.75rem; padding-inline: 1rem; border: 1px solid var(--lavender); border-radius: 0.25rem; color: var(--text); background: var(--surface0); cursor: pointer; }
    .quiz button:active { background: var(--surface1); }
    .quiz :is(input, button):focus-visible { outline: 2px solid var(--lavender); outline-offset: 3px; }
    .quiz-feedback[data-correct="true"], .quiz-completion { color: var(--green); }
    .quiz-feedback[data-correct="false"] { color: var(--peach); }
    .quiz-sync { color: var(--subtext0); }
  </style>
</head>
<body>
<!-- NAV -->
  <main>
<!-- BODY -->
  </main>
  <script>
    if (location.protocol === "http:") window.flowHostEvents = new EventSource(new URL("events", location.href));
    const bar = document.querySelector(".bar");
    let tabs = [...document.querySelectorAll('[role="tab"]')];
    let panels = tabs.map((t) => document.getElementById(t.getAttribute("aria-controls")));
    const pad = () => (bar ? bar.offsetHeight : 0) + 8;
    const setClearance = () => document.documentElement.style.setProperty("--nav-clearance", `${pad()}px`);
    if (bar) new ResizeObserver(setClearance).observe(bar);
    setClearance();
    let open = 0;
    let stops = [];
    let current = -1;
    function mark(i) {
      current = i;
      const id = stops[i]?.id;
      document.querySelectorAll("[data-selected]").forEach((s) => s.removeAttribute("data-selected"));
      if (stops[i]) stops[i].setAttribute("data-selected", "");
      document.querySelectorAll(".jump-row a[data-for]").forEach((a) => a.setAttribute("aria-current", String(a.dataset.for === id)));
    }
    function show(t, selectedStop) {
      open = t;
      tabs.forEach((tab, n) => {
        tab.setAttribute("aria-selected", String(n === t));
        tab.tabIndex = n === t ? 0 : -1;
      });
      panels.forEach((p, n) => { p.hidden = n !== t; });
      document.querySelectorAll(".jump-row[data-tab]").forEach((row) => { row.hidden = row.dataset.tab !== panels[t].id; });
      setClearance();
      stops = [...panels[t].querySelectorAll("[data-stop]")];
      mark(selectedStop ? stops.findIndex((s) => s.id === selectedStop) : -1);
    }
    function focusOn(el) {
      if (!el.matches("a[href], button, [tabindex]")) el.tabIndex = -1;
      el.focus({ preventScroll: true });
    }
    function openTab(t) {
      show(t);
      history.replaceState(null, "", `#${panels[t].id}`);
      scrollTo({ top: 0, behavior: "instant" });
      tabs[t].focus({ preventScroll: true });
    }
    function reveal(id) {
      let el = id ? document.getElementById(id) : null;
      if (el?.dataset.flowTarget) el = document.getElementById(el.dataset.flowTarget);
      if (tabs.includes(el)) el = panels[tabs.indexOf(el)];
      const t = el ? panels.findIndex((p) => p.contains(el)) : -1;
      if (t >= 0 && t !== open) show(t);
      if (el) for (let parent = el.parentElement; parent; parent = parent.parentElement) {
        if (parent.matches("details")) parent.open = true;
      }
      return t >= 0 ? el : null;
    }
    function markFromScroll() {
      let i = -1;
      stops.forEach((s, n) => { if (s.getBoundingClientRect().top <= pad() + 2) i = n; });
      const atEnd = scrollY + innerHeight >= document.documentElement.scrollHeight - 2;
      const pickedStopStillOnScreenAtEnd = atEnd && current > i && stops[current].getBoundingClientRect().top < innerHeight;
      if (pickedStopStillOnScreenAtEnd) i = current;
      mark(i);
    }
    function jump(i) {
      if (i < 0 || i >= stops.length) return;
      stops[i].scrollIntoView({ block: "start", behavior: "instant" });
      mark(i);
      history.replaceState(null, "", `#${stops[i].id}`);
      focusOn(stops[i]);
    }
    function openTree() {
      const tree = document.getElementById("stage-tree");
      tree.showModal();
      (tree.querySelector(`a[href="#${CSS.escape(panels[open].id)}"]`) ?? tree.querySelector("a")).focus();
    }
    addEventListener("click", (e) => {
      const tree = document.getElementById("stage-tree");
      if (e.target.closest?.(".tree-open")) {
        if (tree.open) tree.close();
        else openTree();
        return;
      }
      if (e.target === tree) { tree.close(); return; }
      const a = e.target.closest?.('a[href^="#"]');
      if (!a) return;
      const id = decodeURIComponent(a.getAttribute("href").slice(1));
      const t = panels.findIndex((p) => p.id === id);
      if (t >= 0) {
        e.preventDefault();
        if (tree?.open) tree.close();
        openTab(t);
        return;
      }
      const el = reveal(id);
      if (el && tree?.open) tree.close();
      const i = stops.findIndex((s) => s.id === el?.id);
      if (i >= 0) mark(i);
      if (el && location.hash === a.getAttribute("href")) {
        e.preventDefault();
        el.scrollIntoView({ block: "start", behavior: "instant" });
        focusOn(el);
      }
    });
    function goToHash(focus) {
      const el = reveal(decodeURIComponent(location.hash.slice(1)));
      if (!el) return;
      el.scrollIntoView({ block: "start", behavior: "instant" });
      if (stops.includes(el)) mark(stops.indexOf(el));
      if (focus) focusOn(el);
    }
    addEventListener("hashchange", () => goToHash(true));
    addEventListener("scroll", markFromScroll, { passive: true });
    const editable = (el) => el instanceof Element && (el.isContentEditable || el.closest("input, textarea, select") !== null);
    addEventListener("keydown", (e) => {
      if (e.defaultPrevented || e.isComposing || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || editable(e.target)) return;
      const tree = document.getElementById("stage-tree");
      if (e.key === "t" && tree) {
        e.preventDefault();
        if (tree.open) tree.close();
        else openTree();
        return;
      }
      if (tree?.open) return;
      if (e.key === "n") {
        const queue = [...document.querySelectorAll(".question[data-next]")].sort((a, b) => Number(a.dataset.next) - Number(b.dataset.next));
        if (!queue.length) return;
        e.preventDefault();
        const next = queue[(queue.indexOf(stops[current]) + 1) % queue.length];
        reveal(next.id);
        jump(stops.indexOf(next));
        return;
      }
      if ((e.key === "h" || e.key === "ArrowLeft") && open > 0) { e.preventDefault(); openTab(open - 1); }
      else if ((e.key === "l" || e.key === "ArrowRight") && open < tabs.length - 1) { e.preventDefault(); openTab(open + 1); }
      else if (!stops.length) return;
      else if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); jump(current + 1); }
      else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); jump(Math.max(current - 1, 0)); }
    });
    const flowId = document.querySelector('meta[name="flow-page-flow"]')?.content ?? "";
    const local = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
      drop(k) { try { localStorage.removeItem(k); } catch {} },
    };
    const demoValue = (v) => (typeof v === "boolean" ? (v ? "yes" : "no") : String(v));
    function holds(c, values) {
      if (c.all) return c.all.every((x) => holds(x, values));
      if (c.any) return c.any.some((x) => holds(x, values));
      if (c.not) return !holds(c.not, values);
      const v = values[c.value];
      switch (c.op) {
        case "eq": return v === c.to;
        case "ne": return v !== c.to;
        case "lt": return v < c.to;
        case "le": return v <= c.to;
        case "gt": return v > c.to;
        default: return v >= c.to;
      }
    }
    function step(action, now) {
      const t = action.transitions.find((x) => (!x.from || x.from.includes(now.state)) && (!x.when || holds(x.when, now.values)));
      if (!t) return null;
      const values = { ...now.values };
      for (const [name, e] of Object.entries(t.set ?? {})) values[name] = "add" in e ? now.values[name] + e.add : "toggle" in e ? !now.values[name] : e.set;
      return { state: t.to ?? now.state, values };
    }
    const demos = new WeakSet();
    const media = new WeakSet();
    function hydrateInteractions() {
      for (const el of document.querySelectorAll(".demo[data-demo]")) {
        if (demos.has(el)) continue;
        demos.add(el);
        const def = JSON.parse(el.dataset.demo);
        const key = `flow-page:demo:${flowId}:${el.dataset.key}`;
        const start = () => ({ state: def.start, values: Object.fromEntries(def.values.map((v) => [v.name, v.initial])) });
        const fits = (s) => s && def.states.some((x) => x.name === s.state) && def.values.every((v) => typeof s.values?.[v.name] === typeof v.initial);
        let now = start();
        try {
          const saved = JSON.parse(local.get(key));
          if (fits(saved)) now = saved;
        } catch {}
        const actions = new Map(def.actions.map((a) => [a.name, a]));
        const buttons = [...el.querySelectorAll("button[data-action], button[data-reset]")];
        function paint() {
          document.getElementById(`${el.id}-state`).textContent = def.states.find((x) => x.name === now.state).label;
          el.querySelectorAll("[data-demo-state]").forEach((d) => { d.hidden = d.dataset.demoState !== now.state; });
          for (const v of def.values) document.getElementById(`${el.id}-v-${v.name}`).textContent = demoValue(now.values[v.name]);
          // aria-disabled keeps an unavailable action focusable, so the keyboard does not lose its place.
          for (const b of buttons) {
            b.disabled = false;
            b.setAttribute("aria-disabled", String(b.dataset.action !== undefined && !step(actions.get(b.dataset.action), now)));
          }
        }
        el.addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b || !buttons.includes(b) || b.getAttribute("aria-disabled") === "true") return;
          if (b.dataset.action === undefined) {
            now = start();
            local.drop(key);
          } else {
            now = step(actions.get(b.dataset.action), now);
            local.set(key, JSON.stringify(now));
          }
          paint();
        });
        paint();
      }
      for (const video of document.querySelectorAll("video[src]")) {
        if (media.has(video)) continue;
        media.add(video);
        const key = `flow-page:playback:${flowId}:${video.getAttribute("src")}`;
        const resume = () => {
          const t = Number(local.get(key));
          if (t > 0 && t < video.duration) video.currentTime = t;
        };
        if (video.readyState >= 1) resume();
        else video.addEventListener("loadedmetadata", resume, { once: true });
        let saved = 0;
        video.addEventListener("timeupdate", () => {
          if (Math.abs(video.currentTime - saved) < 1) return;
          saved = video.currentTime;
          local.set(key, String(saved));
        });
        video.addEventListener("pause", () => local.set(key, String(video.currentTime)));
        video.addEventListener("ended", () => local.drop(key));
      }
    }
    hydrateInteractions();

    const nodeKey = (n) => n.nodeType === Node.ELEMENT_NODE
      ? n.id || n.getAttribute("data-tab") || (n.tagName === "A" ? n.getAttribute("href") : n.tagName === "DETAILS" ? `details:${n.className}` : null)
      : null;
    const compatible = (a, b) => a.nodeType === b.nodeType && a.nodeName === b.nodeName && nodeKey(a) === nodeKey(b);
    const interactionData = (el) => el.dataset.demo ?? el.dataset.quiz;
    function patch(live, next) {
      if (live.isEqualNode(next)) return;
      if (live.nodeType !== Node.ELEMENT_NODE) {
        live.nodeValue = next.nodeValue;
        return;
      }
      if (interactionData(live) !== undefined && live.dataset.key === next.dataset.key && interactionData(live) === interactionData(next)) return;
      const preserved = (name) => name === "open" && live.matches("details, dialog");
      for (const a of [...live.attributes]) if (!preserved(a.name) && !next.hasAttribute(a.name)) live.removeAttribute(a.name);
      for (const a of next.attributes) if (!preserved(a.name) && live.getAttribute(a.name) !== a.value) live.setAttribute(a.name, a.value);
      if (live.isContentEditable && live.contains(document.activeElement)) return;
      const keyed = new Map([...live.childNodes].filter(nodeKey).map((n) => [nodeKey(n), n]));
      let cursor = live.firstChild;
      for (const child of next.childNodes) {
        const key = nodeKey(child);
        let match = key ? keyed.get(key) : cursor && !nodeKey(cursor) && compatible(cursor, child) ? cursor : null;
        if (match && !compatible(match, child)) match = null;
        if (!match) {
          match = child.cloneNode(true);
          live.insertBefore(match, cursor);
        } else {
          if (match !== cursor) live.insertBefore(match, cursor);
          if (match.nodeType === Node.ELEMENT_NODE && interactionData(match) !== undefined && (match.dataset.key !== child.dataset.key || interactionData(match) !== interactionData(child))) {
            const replacement = child.cloneNode(true);
            match.replaceWith(replacement);
            match = replacement;
          } else patch(match, child);
        }
        cursor = match.nextSibling;
      }
      while (cursor) {
        const removed = cursor;
        cursor = cursor.nextSibling;
        removed.remove();
      }
    }
    function refreshReadingView(next) {
      const selected = panels[open]?.id;
      const focused = document.activeElement;
      const x = scrollX, y = scrollY;
      const visible = (el) => { const box = el?.getBoundingClientRect(); return !!box && box.top < innerHeight && box.bottom > pad(); };
      const target = location.hash.length > 1 ? document.getElementById(decodeURIComponent(location.hash.slice(1))) : null;
      const picked = stops[current];
      const reading = target && panels[open]?.contains(target) && visible(target) ? target
        : visible(picked) ? picked
        : [...(panels[open]?.querySelectorAll("[data-stop]") ?? [])].reverse()
          .find((el) => el.getBoundingClientRect().top <= pad());
      const offset = reading?.getBoundingClientRect().top;
      patch(bar, next.querySelector(".bar"));
      patch(document.querySelector("main"), next.querySelector("main"));
      tabs = [...document.querySelectorAll('[role="tab"]')];
      panels = tabs.map((t) => document.getElementById(t.getAttribute("aria-controls")));
      show(Math.max(0, panels.findIndex((p) => p.id === selected)), picked?.id);
      hydrateInteractions();
      if (focused?.isConnected && document.activeElement !== focused) focusOn(focused);
      scrollTo({ left: x, top: reading?.isConnected ? scrollY + reading.getBoundingClientRect().top - offset : y, behavior: "instant" });
      if (!picked || stops[current]?.id !== picked.id) markFromScroll();
    }
    const revisionMeta = document.querySelector('meta[name="flow-page-revision"]');
    let wantedRevision = Number(revisionMeta.content);
    const observationsMeta = document.querySelector('meta[name="flow-page-observations"]');
    let wantedObservations = observationsMeta.content;
    let refreshing = false;
    let retry;
    async function receiveRevision(e) {
      const update = JSON.parse(e.data);
      if (update.revision !== undefined) wantedRevision = Math.max(wantedRevision, update.revision);
      if (update.version !== undefined) wantedObservations = update.version;
      const pending = () => wantedRevision > Number(revisionMeta.content) || wantedObservations !== observationsMeta.content;
      if (refreshing || !pending()) return;
      refreshing = true;
      clearTimeout(retry);
      try {
        while (pending()) {
          const requestedObservations = wantedObservations;
          const response = await fetch(location.href, { cache: "no-store" });
          if (!response.ok) throw new Error(`Flow refresh failed (${response.status})`);
          const next = new DOMParser().parseFromString(await response.text(), "text/html");
          const revision = Number(next.querySelector('meta[name="flow-page-revision"]')?.content);
          const observations = next.querySelector('meta[name="flow-page-observations"]')?.content;
          if (!(revision >= Number(revisionMeta.content)) || !observations) throw new Error("Flow refresh is not current");
          refreshReadingView(next);
          revisionMeta.content = String(revision);
          observationsMeta.content = observations;
          if (wantedObservations === requestedObservations) wantedObservations = observations;
          document.dispatchEvent(new CustomEvent("flow-page-updated", { detail: { revision } }));
        }
      } catch {
        retry = setTimeout(() => receiveRevision({ data: JSON.stringify({ revision: wantedRevision, version: wantedObservations }) }), 2000);
      } finally {
        refreshing = false;
      }
    }
    window.flowHostEvents?.addEventListener("revision", receiveRevision);
    window.flowHostEvents?.addEventListener("observations", receiveRevision);
    const quizStorage = `flow-page:learning:${flowId}`;
    let learningState = { attempts: [], accepted: [] };
    try {
      const saved = JSON.parse(local.get(quizStorage));
      if (Array.isArray(saved?.attempts) && Array.isArray(saved?.accepted)) learningState = saved;
    } catch {}
    let durableLocal = true;
    const saveLearning = () => {
      try { localStorage.setItem(quizStorage, JSON.stringify(learningState)); durableLocal = true; }
      catch { durableLocal = false; }
    };
    const grade = (q, answer) => {
      const rule = q.answer;
      if ("choice" in rule) return answer === rule.choice;
      if ("number" in rule) return answer.trim() !== "" && Number.isFinite(Number(answer)) && Math.abs(Number(answer) - rule.number) <= rule.tolerance;
      const normalize = (s) => rule.case_sensitive ? s.trim() : s.trim().toLowerCase();
      return rule.text.some((s) => normalize(s) === normalize(answer));
    };
    const quizReady = new WeakSet();
    let syncing = false;
    let syncError = false;
    function paintQuizzes() {
      for (const el of document.querySelectorAll(".quiz[data-quiz]")) {
        const def = JSON.parse(el.dataset.quiz);
        const [result, rev] = el.dataset.key.split(":r");
        const attempts = learningState.attempts.filter((a) => a.result === result && a.revision === Number(rev));
        for (const form of el.querySelectorAll("form[data-question]")) {
          const q = def.questions.find((q) => q.ref === form.dataset.question);
          const latest = attempts.filter((a) => a.question === q.ref).at(-1);
          const feedback = form.querySelector(".quiz-feedback");
          if (latest) {
            const right = grade(q, latest.answer);
            feedback.dataset.correct = String(right);
            feedback.textContent = `${right ? "Correct." : "Not yet."} ${q.explanation} Attempts: ${attempts.filter((a) => a.question === q.ref).length}.`;
          }
        }
        const complete = def.questions.every((q) => attempts.some((a) => a.question === q.ref && grade(q, a.answer)));
        el.querySelector(".quiz-completion").textContent = complete ? "Lesson complete." : "Lesson in progress.";
        const pending = attempts.filter((a) => !learningState.accepted.includes(a.id)).length;
        el.querySelector(".quiz-sync").textContent = !durableLocal ? "Browser storage is unavailable. Unsynced attempts may be lost when this page closes." : location.protocol === "file:" ? "Saved in this browser. Offline export." : pending ? `${pending} attempt(s) saved in this browser, waiting to sync.` : syncError ? "Server unavailable. Saved progress remains in this browser." : "Progress saved with the Flow.";
      }
    }
    async function syncLearning() {
      if (syncing || location.protocol !== "http:" || !document.querySelector(".quiz")) return;
      syncing = true;
      try {
        const pending = learningState.attempts.filter((a) => !learningState.accepted.includes(a.id)).slice(0, 100);
        const r = await fetch(new URL("learning", location.href), pending.length ? { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ version: 1, attempts: pending }) } : { credentials: "same-origin" });
        if (!r.ok) throw new Error(`Learning sync ${r.status}`);
        const progress = await r.json();
        const all = new Map(learningState.attempts.map((a) => [a.id, a]));
        for (const a of progress.attempts) all.set(a.id, { id: a.id, result: a.result, revision: a.revision, question: a.question, answer: a.answer });
        learningState.attempts = [...all.values()];
        learningState.accepted = [...new Set([...learningState.accepted, ...progress.attempts.map((a) => a.id)])];
        syncError = false;
        saveLearning();
      } catch { syncError = true; }
      finally { syncing = false; paintQuizzes(); }
    }
    function hydrateQuizzes() {
      for (const el of document.querySelectorAll(".quiz[data-quiz]")) {
        if (quizReady.has(el)) continue;
        quizReady.add(el);
        el.addEventListener("keydown", (e) => e.stopPropagation());
        el.addEventListener("submit", (e) => {
          e.preventDefault();
          const form = e.target;
          const def = JSON.parse(el.dataset.quiz);
          const q = def.questions.find((q) => q.ref === form.dataset.question);
          const answer = q.choices ? form.querySelector("input:checked")?.value : form.querySelector("input").value;
          if (!answer?.trim()) { form.querySelector(".quiz-feedback").textContent = "Enter or choose an answer first."; return; }
          const [result, rev] = el.dataset.key.split(":r");
          learningState.attempts.push({ id: crypto.randomUUID(), result, revision: Number(rev), question: q.ref, answer });
          saveLearning();
          paintQuizzes();
          void syncLearning();
        });
      }
      paintQuizzes();
      void syncLearning();
    }
    document.addEventListener("flow-page-updated", hydrateQuizzes);
    addEventListener("online", syncLearning);
    addEventListener("focus", syncLearning);
    addEventListener("storage", (e) => {
      if (e.key !== quizStorage || !e.newValue) return;
      try {
        const incoming = JSON.parse(e.newValue);
        const all = new Map(learningState.attempts.map((a) => [a.id, a]));
        for (const a of incoming.attempts) all.set(a.id, a);
        learningState.attempts = [...all.values()];
        learningState.accepted = [...new Set([...learningState.accepted, ...incoming.accepted])];
        paintQuizzes();
        void syncLearning();
      } catch {}
    });
    setInterval(syncLearning, 15000);
    hydrateQuizzes();
    show(0);
    goToHash(false);
  </script>
</body>
</html>
