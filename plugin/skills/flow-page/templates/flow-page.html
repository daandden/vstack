<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Flow: {{title}}</title>
  <!-- META -->
  <!-- scripts/render.ts fills this page. Do not edit a rendered page by hand. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; min-inline-size: 0; }
    :root {
      color-scheme: dark;
      /* Catppuccin Mocha, each hex as oklch. */
      --base: oklch(24.3% 0.030 283.9);
      --mantle: oklch(21.6% 0.025 284.1);
      --surface0: oklch(32.4% 0.032 282.0);
      --surface1: oklch(40.4% 0.032 280.2);
      --overlay0: oklch(55.0% 0.034 277.1);
      --subtext0: oklch(75.1% 0.040 273.9);
      --subtext1: oklch(81.7% 0.040 272.9);
      --text: oklch(87.9% 0.043 272.3);
      --mauve: oklch(78.7% 0.119 304.8);
      --blue: oklch(76.6% 0.111 259.9);
      --lavender: oklch(81.7% 0.091 277.3);
      --yellow: oklch(91.9% 0.070 86.5);
      --peach: oklch(82.4% 0.101 52.6);
      --green: oklch(85.8% 0.109 142.7);
      --red: oklch(75.6% 0.130 2.8);
      --teal: oklch(85.8% 0.079 182.7);
      --pink: oklch(87.0% 0.075 336.3);
      --line: color-mix(in oklch, var(--surface1) 60%, transparent);
      scrollbar-gutter: stable;
      --nav-clearance: 5rem;
      scroll-padding-block-start: var(--nav-clearance);
      /* Three font sizes only: title, body, small. */
      --fs-title: 0.9375rem;
      --fs-body: 0.8125rem;
      --fs-small: 0.75rem;
      text-wrap: pretty;
      overflow-wrap: break-word;
      font-synthesis: none;
    }
    /* Yellow is your pick everywhere: the picked label, the picked dot, and the answer line. Teal is a decision read from your words. */
    [data-state="picked"] { --state: var(--yellow); }
    [data-state="resolved"] { --state: var(--teal); }
    [data-state="unresolved"] { --state: var(--red); }
    [data-state="open"], [data-state="retired"] { --state: var(--overlay0); }
    [data-state="finished"] { --state: var(--green); }
    [data-state="in-progress"] { --state: var(--peach); }
    [data-state="not-started"] { --state: var(--overlay0); }
    [data-state="closed"] { --state: var(--green); }
    [data-state="reopened"] { --state: var(--peach); }
    [hidden] { display: none !important; }
    body { margin: 0; min-block-size: 100svh; background: var(--base); color: var(--text); font: var(--fs-body)/normal "IosevkaTerm Nerd Font Mono", "Iosevka Term", "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0; }
    h1, h2, h3, h4 { margin-block: 0; color: var(--text); text-wrap: balance; font-family: "IosevkaTermSlab Nerd Font Mono", "Iosevka Term Slab", "JetBrains Mono", ui-monospace, monospace; font-size: var(--fs-body); line-height: normal; }
    p, ul, ol, dl, dd, figure { margin: 0; }
    a { color: var(--blue); text-underline-offset: 0.2em; touch-action: manipulation; }
    a:active, .terms dt a:active { color: var(--lavender); }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 0.2em; }
    @media (hover: hover) and (pointer: fine) { a:hover, .terms dt a:hover { color: var(--lavender); } }
    code, pre { font: inherit; }
    code { padding-inline: 0.25em; border-radius: 0.2rem; background: var(--surface0); color: var(--text); }
    pre { white-space: pre-wrap; font-size: var(--fs-small); }
    svg, img, video { display: block; max-inline-size: 100%; block-size: auto; }

    .bar { position: sticky; inset-block-start: 0; z-index: 1; background: var(--mantle); border-block-end: 1px solid var(--line); font-size: var(--fs-small); }
    .tabs, .jump-row { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: center; padding-block: 0.375rem; padding-inline: 1.25rem; }
    .jump-row { border-block-start: 1px solid var(--line); }
    .tabs a, .jump-row a { display: inline-flex; gap: 0.375rem; align-items: center; padding-inline: 0.25rem; border-radius: 0.25rem; color: var(--subtext1); text-decoration: none; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tabs a[aria-selected="true"], .jump-row a[aria-current="true"] { background: var(--surface1); color: var(--mauve); }
    .jump-row .sep { inline-size: 1px; block-size: 1rem; background: var(--surface1); }
    .dot { flex: none; inline-size: 0.4375rem; block-size: 0.4375rem; border-radius: 50%; background: var(--state, var(--overlay0)); }

    main { --content: 100rem; --gutter: 1.25rem; display: grid; grid-template-columns: [full-start] minmax(var(--gutter), 1fr) [content-start] min(calc(100% - var(--gutter) * 2), var(--content)) [content-end] minmax(var(--gutter), 1fr) [full-end]; gap: 1.5rem 0; padding-block: 1rem; }
    main > * { grid-column: content; }
    .stage .pick { color: var(--yellow); }
    .stage .read { color: var(--teal); }
    .stage .open { color: var(--overlay0); }
    .sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: clip; clip-path: inset(50%); white-space: nowrap; }
    .page-head { display: grid; gap: 0.25rem; }
    .lifecycle { color: var(--state); font-size: var(--fs-small); font-weight: 600; }
    .crumb, time, .label { color: var(--subtext0); }
    .crumb, time, .label, .why { font-size: var(--fs-small); }
    h1 { font-size: var(--fs-title); font-weight: 700; }

    .tab, .round { display: grid; gap: 1.5rem; }
    .empty { color: var(--subtext0); }
    .lineage { display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem; padding-inline-start: 0; list-style: none; }
    .lineage a { font-weight: 600; text-decoration: none; }
    .lineage .label { margin-inline-end: 0.5rem; font-weight: 600; }

    .stages { display: grid; gap: 1rem; padding-inline-start: 0; list-style: none; }
    .stage { display: grid; gap: 0.375rem; padding-block-end: 0.75rem; border-block-end: 1px solid var(--line); }
    .stage h3 { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; }
    .stage h3 a { display: inline-flex; gap: 0.5rem; align-items: center; color: var(--mauve); text-decoration: none; }
    .stage .meta { display: inline-flex; gap: 0.75rem; font-size: var(--fs-small); font-weight: 400; color: var(--subtext0); }
    .stage .meta .state { color: var(--state); font-weight: 600; }
    .stage .label { font-weight: 600; }
    .stage ul { display: grid; gap: 0.125rem; padding-inline-start: 1.25rem; }
    .stage li::marker { color: var(--overlay0); }
    .stage li a { font-weight: 600; text-decoration: none; }

    .background { display: grid; gap: 0.625rem; }
    .background > header { display: grid; gap: 0.125rem; }
    .background > header .label { font-weight: 600; text-transform: uppercase; }
    .background h2 { font-size: var(--fs-title); font-weight: 700; text-transform: none; color: var(--text); }
    .background section { display: grid; gap: 0.375rem; }
    .background h3 { font-size: var(--fs-body); color: var(--lavender); }
    .summary-line { color: var(--subtext1); }
    .sources { display: grid; gap: 0.125rem; }
    .sources .label { font-weight: 600; }

    .topic { display: grid; gap: 0.5rem; padding-block-end: 0.75rem; border-block-end: 1px solid var(--line); }
    .topics { display: grid; gap: 0.125rem; }
    .topics a { font-weight: 600; text-decoration: none; }

    .round > header { display: grid; gap: 0.125rem; padding-block-start: 0.5rem; border-block-start: 1px solid var(--surface1); }
    h2 { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; font-size: var(--fs-small); font-weight: 650; text-transform: uppercase; color: var(--subtext0); }
    h2 time { font-weight: 400; text-transform: none; font-variant-numeric: tabular-nums; }

    .question { display: grid; gap: 0.625rem; padding-block-end: 0.5rem; border-block-end: 1px solid var(--line); }
    h3 { font-size: var(--fs-title); font-weight: 650; color: var(--mauve); }
    .qnum { margin-inline-end: 0.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .description { display: grid; gap: 0.5rem; }
    .bullets { display: grid; gap: 0.125rem; padding-inline-start: 1.25rem; }
    .bullets > li::marker { color: var(--overlay0); }
    .example, .today, .terms, .result-links { display: grid; gap: 0.125rem; }
    :is(.example, .today, .terms, .topics, .result-links) > .label { font-weight: 600; color: var(--pink); }
    /* Today lists how things work now, each fact followed by its file and line. */
    .source { color: var(--subtext0); font-size: var(--fs-small); }
    .terms dl, .fields { display: grid; gap: 0.125rem; }
    .terms dt { font-weight: 600; color: var(--teal); }
    .terms dt :is(code, a) { color: inherit; }
    .fields dt { font-size: var(--fs-small); font-weight: 600; color: var(--subtext1); }
    :is(.terms dl, .fields) > dd + dt { margin-block-start: 0.5rem; }
    /* An example can be a list or a screen, so it keeps its line breaks and leading spaces. */
    .example p:not(.label) { white-space: pre-wrap; }

    .visual, .preview { padding-block: 0.625rem; padding-inline: 0.75rem; border-radius: 0.375rem; background: var(--mantle); overflow-x: auto; }
    .visual { display: grid; gap: 0.5rem; }
    .preview { display: grid; gap: 0.375rem; justify-items: start; }

    .options { display: grid; padding-inline-start: 0; list-style: none; }
    .option { display: grid; gap: 0.25rem; padding-block: 0.5rem; }
    h4 { font-weight: 400; color: var(--blue); }
    .option[data-picked] h4 { color: var(--yellow); font-weight: 700; }
    .star { margin-inline-start: 0.5rem; color: var(--yellow); font-weight: 700; }
    .trade { display: grid; padding-inline-start: 0; list-style: none; }
    .trade > li { position: relative; padding-inline-start: 1.25rem; }
    .gain::before, .cost::before { position: absolute; inset-inline-start: 0; font-weight: 700; }
    .gain::before { content: "+"; color: var(--green); }
    .cost::before { content: "\2212"; color: var(--red); }
    .why { color: var(--subtext0); }

    .answer { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; color: var(--text); }
    .answer > .label { font-weight: 600; color: var(--state); }

    .summary { display: grid; gap: 0.5rem; }
    .decisions { display: grid; gap: 0.25rem; padding-inline-start: 1.25rem; }
    .decisions > li::marker { color: var(--overlay0); }
    .decisions a { font-weight: 600; text-decoration: none; }

    .result { display: grid; gap: 0.75rem; }
    .result > header { display: grid; gap: 0.25rem; padding-block-start: 0.5rem; border-block-start: 1px solid var(--surface1); }
    .result-summary { color: var(--subtext1); }
    .result .entries { display: grid; gap: 0.75rem; padding-inline-start: 0; list-style: none; }
    .card, .claim { display: grid; gap: 0.375rem; padding-block-end: 0.5rem; border-block-end: 1px solid var(--line); }
    .card:last-child, .claim:last-child { padding-block-end: 0; border-block-end: none; }
    .entry-id { margin-inline-end: 0.5rem; font-weight: 700; font-variant-numeric: tabular-nums; text-transform: uppercase; }
    .result-links .entry-id { margin-inline-end: 0; }
    .tag { color: var(--subtext0); font-size: var(--fs-small); font-weight: 600; }
    .card[data-blocking] .tag { color: var(--red); }
    .card .evidence > summary { inline-size: fit-content; font-size: var(--fs-small); font-weight: 600; color: var(--subtext1); cursor: pointer; touch-action: manipulation; }
    .card .evidence > summary:active { color: var(--lavender); }
    .card .evidence[open] > summary { margin-block-end: 0.125rem; }
    [data-status="confirmed"] { --state: var(--red); }
    [data-status="cleared"] { --state: var(--green); }
    [data-status="unproven"] { --state: var(--peach); }
    .claim .tag { color: var(--state); }
    .result .ask { display: grid; gap: 0.125rem; }
    .result .ask .label { font-weight: 600; }
    .result .ask a, .result td a { font-weight: 600; text-decoration: none; }
    .result .table { overflow-x: auto; }
    .result table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .result th, .result td { padding-block: 0.25rem; padding-inline: 0.5rem; border-block-end: 1px solid var(--line); text-align: start; vertical-align: top; }
    .result th { color: var(--subtext0); font-size: var(--fs-small); font-weight: 600; }
    .card:target, .claim:target, .result tr:target { background: var(--surface0); }

    /* A Document reads top to bottom: sections, then limitations, citations, and sources. */
    .provenance { color: var(--subtext0); font-size: var(--fs-small); }
    .document { display: grid; gap: 1rem; }
    .doc-section { display: grid; gap: 0.625rem; }
    .doc-section h3 { color: var(--lavender); }
    .doc-section:target, .citations li:target { background: var(--surface0); }
    .code { display: grid; gap: 0.25rem; }
    /* Code keeps every space and line break; a long line scrolls inside its block. */
    .code pre { margin: 0; padding-block: 0.5rem; padding-inline: 0.75rem; border-radius: 0.375rem; background: var(--mantle); white-space: pre; overflow-x: auto; tab-size: 4; }
    .code code { padding-inline: 0; background: none; }
    .cite { font-size: var(--fs-small); font-weight: 600; text-decoration: none; font-variant-numeric: tabular-nums; }
    .backlink { font-size: var(--fs-small); }
    :is(.limitations, .citations) { display: grid; gap: 0.125rem; }
    :is(.limitations, .citations) > .label { font-weight: 600; }
    .limitations > .label { color: var(--peach); }

    .attachments { display: grid; gap: 0.75rem; }
    .attachments > .label { font-weight: 600; }
    .attachment { display: grid; gap: 0.375rem; justify-items: start; padding-block: 0.625rem; padding-inline: 0.75rem; border-radius: 0.375rem; background: var(--mantle); }
    .attachment img, .attachment video { border-radius: 0.25rem; background: var(--surface0); }
    .attachment figcaption { display: grid; gap: 0.125rem; }
    .attachment-meta { display: flex; flex-wrap: wrap; gap: 0.125rem 0.75rem; color: var(--subtext0); font-size: var(--fs-small); }
    .attachment-meta .kind { font-weight: 600; color: var(--teal); }
    .attachment[data-availability="unavailable"] .attachment-meta .kind { color: var(--red); }
    .attachment[data-availability="external"] .attachment-meta .kind { color: var(--peach); }
    .unavailable, .download { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; }
    .unavailable > .label { font-weight: 600; color: var(--red); }
    .launch { display: grid; gap: 0.25rem; }
    .launch > .label { font-weight: 600; }
    .revisions > summary { inline-size: fit-content; font-size: var(--fs-small); font-weight: 600; color: var(--subtext1); cursor: pointer; touch-action: manipulation; }
    .revisions > summary:active { color: var(--lavender); }
    .revisions[open] > summary { margin-block-end: 0.75rem; }
    .revisions > .result { padding-inline-start: 0.75rem; border-inline-start: 2px solid var(--surface1); }

    /* The progress strip: one line per fact, so a task count, a Stage, a PR, a check, and an End state stay apart. */
    [data-task="done"], [data-check="passed"], [data-pr="merged"] { --state: var(--green); }
    [data-task="active"], [data-check="pending"], [data-pr="open"] { --state: var(--peach); }
    [data-task="pending"], [data-task="skipped"], [data-task="inapplicable"], [data-pr="closed"] { --state: var(--overlay0); }
    [data-check="failed"], [data-blocked] { --state: var(--red); }
    .progress { display: grid; gap: 0.75rem; padding: 0.75rem; border: 1px solid var(--surface1); border-radius: 0.375rem; background: var(--mantle); }
    .progress > header { display: grid; gap: 0.25rem; }
    .progress .verdict { font-weight: 600; color: var(--peach); }
    .progress[data-complete] .verdict { color: var(--green); }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 0.5rem 1.5rem; }
    .facts dt { font-size: var(--fs-small); font-weight: 600; color: var(--subtext0); }
    .facts dd { font-variant-numeric: tabular-nums; }
    .progress .tag { color: var(--state); }
    .blockers { display: grid; gap: 0.125rem; }
    .blockers > .label { font-weight: 600; color: var(--red); }
    .tasks { display: grid; gap: 0.375rem; padding-inline-start: 0; list-style: none; }
    .task { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; }
    .task > .tag { min-inline-size: 7em; }
    .task[data-task="skipped"], .task[data-task="inapplicable"] { color: var(--subtext0); }
    .task .blocked { color: var(--red); font-size: var(--fs-small); font-weight: 600; }
    .task :is(.reason, .evidence, .resolved) { flex-basis: 100%; }
    @media (min-width: 40rem) { .task :is(.reason, .evidence, .resolved) { margin-inline-start: calc(7em + 0.75rem); } }
    .progress .evidence > summary { inline-size: fit-content; font-size: var(--fs-small); font-weight: 600; color: var(--subtext1); cursor: pointer; touch-action: manipulation; }
    .task:target { background: var(--surface0); }
    /* A demo shows where it is now, then its actions, then how each action works. */
    .demo { display: grid; gap: 0.625rem; justify-items: start; padding-block: 0.625rem; padding-inline: 0.75rem; border-radius: 0.375rem; background: var(--mantle); }
    .demo-now { display: grid; gap: 0.375rem; }
    .demo-state { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; }
    .demo-state > .label { font-weight: 600; }
    .demo-state > strong { color: var(--mauve); font-size: var(--fs-title); }
    .demo-values dd { font-variant-numeric: tabular-nums; color: var(--teal); }
    .demo-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .demo-actions button { padding-block: 0.25rem; padding-inline: 0.625rem; border: 1px solid var(--surface1); border-radius: 0.25rem; background: var(--surface0); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; touch-action: manipulation; }
    .demo-actions button:active { background: var(--surface1); }
    .demo-actions button:is(:disabled, [aria-disabled="true"]) { color: var(--overlay0); border-style: dashed; cursor: not-allowed; }
    .demo-actions .demo-reset { background: none; color: var(--subtext1); }
    @media (hover: hover) and (pointer: fine) { .demo-actions button:not(:disabled, [aria-disabled="true"]):hover { border-color: var(--lavender); } }
    .demo-rules > summary { inline-size: fit-content; font-size: var(--fs-small); font-weight: 600; color: var(--subtext1); cursor: pointer; touch-action: manipulation; }
    .demo-rules[open] > summary { margin-block-end: 0.375rem; }
    .demo-rules { display: grid; gap: 0.375rem; }
  </style>
</head>
<body>
<!-- NAV -->
  <main>
<!-- BODY -->
  </main>
  <script>
    const bar = document.querySelector(".bar");
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = tabs.map((t) => document.getElementById(t.getAttribute("aria-controls")));
    const pad = () => (bar ? bar.offsetHeight : 0) + 8;
    const setClearance = () => document.documentElement.style.setProperty("--nav-clearance", `${pad()}px`);
    if (bar) new ResizeObserver(setClearance).observe(bar);
    setClearance();
    let open = 0;
    let stops = [];
    let current = -1;
    function mark(i) {
      current = i;
      const id = stops[i]?.id;
      document.querySelectorAll(".jump-row a[data-for]").forEach((a) => a.setAttribute("aria-current", String(a.dataset.for === id)));
    }
    function show(t) {
      open = t;
      tabs.forEach((tab, n) => tab.setAttribute("aria-selected", String(n === t)));
      panels.forEach((p, n) => { p.hidden = n !== t; });
      document.querySelectorAll(".jump-row[data-tab]").forEach((row) => { row.hidden = row.dataset.tab !== panels[t].id; });
      setClearance();
      stops = [...panels[t].querySelectorAll("[data-stop]")];
      mark(-1);
    }
    function openTab(t) {
      show(t);
      history.replaceState(null, "", `#${panels[t].id}`);
      scrollTo({ top: 0, behavior: "instant" });
    }
    function reveal(id) {
      const el = id ? document.getElementById(id) : null;
      const t = el ? panels.findIndex((p) => p.contains(el)) : -1;
      if (t >= 0 && t !== open) show(t);
      return t >= 0 ? el : null;
    }
    function markFromScroll() {
      let i = -1;
      stops.forEach((s, n) => { if (s.getBoundingClientRect().top <= pad() + 2) i = n; });
      const atEnd = scrollY + innerHeight >= document.documentElement.scrollHeight - 2;
      const pickedStopStillOnScreenAtEnd = atEnd && current > i && stops[current].getBoundingClientRect().top < innerHeight;
      if (pickedStopStillOnScreenAtEnd) i = current;
      mark(i);
    }
    function jump(i) {
      if (i < 0 || i >= stops.length) return;
      stops[i].scrollIntoView({ block: "start", behavior: "instant" });
      mark(i);
    }
    addEventListener("click", (e) => {
      const a = e.target.closest?.('a[href^="#"]');
      if (!a) return;
      const t = tabs.indexOf(a);
      if (t >= 0) {
        e.preventDefault();
        openTab(t);
        return;
      }
      const id = decodeURIComponent(a.getAttribute("href").slice(1));
      reveal(id);
      const i = stops.findIndex((s) => s.id === id);
      if (i >= 0) mark(i);
    });
    function goToHash() {
      const el = reveal(decodeURIComponent(location.hash.slice(1)));
      if (!el) return;
      el.scrollIntoView({ block: "start", behavior: "instant" });
      if (stops.includes(el)) mark(stops.indexOf(el));
    }
    addEventListener("hashchange", goToHash);
    addEventListener("scroll", markFromScroll, { passive: true });
    addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
      if (e.key === "n") {
        const first = document.querySelector(".question[data-open]");
        if (first) {
          e.preventDefault();
          reveal(first.id);
          history.replaceState(null, "", `#${first.id}`);
          jump(stops.indexOf(first));
        }
        return;
      }
      if ((e.key === "h" || e.key === "ArrowLeft") && open > 0) { e.preventDefault(); openTab(open - 1); }
      else if ((e.key === "l" || e.key === "ArrowRight") && open < tabs.length - 1) { e.preventDefault(); openTab(open + 1); }
      else if (!stops.length) return;
      else if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); jump(current + 1); }
      else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); jump(Math.max(current - 1, 0)); }
    });
    // Demos and media run in this browser only. Their state and playback position go to localStorage, never to the
    // Flow: nothing here answers a question or records work.
    const flowId = document.querySelector('meta[name="flow-page-flow"]')?.content ?? "";
    const local = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
      drop(k) { try { localStorage.removeItem(k); } catch {} },
    };
    const demoValue = (v) => (typeof v === "boolean" ? (v ? "yes" : "no") : String(v));
    function holds(c, values) {
      if (c.all) return c.all.every((x) => holds(x, values));
      if (c.any) return c.any.some((x) => holds(x, values));
      if (c.not) return !holds(c.not, values);
      const v = values[c.value];
      switch (c.op) {
        case "eq": return v === c.to;
        case "ne": return v !== c.to;
        case "lt": return v < c.to;
        case "le": return v <= c.to;
        case "gt": return v > c.to;
        default: return v >= c.to;
      }
    }
    /** The first transition of `action` that leaves `now.state` and whose condition holds, applied; null when none does. */
    function step(action, now) {
      const t = action.transitions.find((x) => (!x.from || x.from.includes(now.state)) && (!x.when || holds(x.when, now.values)));
      if (!t) return null;
      const values = { ...now.values };
      for (const [name, e] of Object.entries(t.set ?? {})) values[name] = "add" in e ? now.values[name] + e.add : "toggle" in e ? !now.values[name] : e.set;
      return { state: t.to ?? now.state, values };
    }
    for (const el of document.querySelectorAll(".demo[data-demo]")) {
      const def = JSON.parse(el.dataset.demo);
      const key = `flow-page:demo:${flowId}:${el.dataset.key}`;
      const start = () => ({ state: def.start, values: Object.fromEntries(def.values.map((v) => [v.name, v.initial])) });
      const fits = (s) => s && def.states.some((x) => x.name === s.state) && def.values.every((v) => typeof s.values?.[v.name] === typeof v.initial);
      let now = start();
      try {
        const saved = JSON.parse(local.get(key));
        if (fits(saved)) now = saved;
      } catch {}
      const actions = new Map(def.actions.map((a) => [a.name, a]));
      const buttons = [...el.querySelectorAll("button[data-action], button[data-reset]")];
      function paint() {
        document.getElementById(`${el.id}-state`).textContent = def.states.find((x) => x.name === now.state).label;
        el.querySelectorAll("[data-demo-state]").forEach((d) => { d.hidden = d.dataset.demoState !== now.state; });
        for (const v of def.values) document.getElementById(`${el.id}-v-${v.name}`).textContent = demoValue(now.values[v.name]);
        // aria-disabled keeps an unavailable action focusable, so the keyboard does not lose its place.
        for (const b of buttons) {
          b.disabled = false;
          b.setAttribute("aria-disabled", String(b.dataset.action !== undefined && !step(actions.get(b.dataset.action), now)));
        }
      }
      el.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b || !buttons.includes(b) || b.getAttribute("aria-disabled") === "true") return;
        if (b.dataset.action === undefined) {
          now = start();
          local.drop(key);
        } else {
          now = step(actions.get(b.dataset.action), now);
          local.set(key, JSON.stringify(now));
        }
        paint();
      });
      paint();
    }
    for (const video of document.querySelectorAll("video[src]")) {
      const key = `flow-page:playback:${flowId}:${video.getAttribute("src")}`;
      const resume = () => {
        const t = Number(local.get(key));
        if (t > 0 && t < video.duration) video.currentTime = t;
      };
      if (video.readyState >= 1) resume();
      else video.addEventListener("loadedmetadata", resume, { once: true });
      let saved = 0;
      video.addEventListener("timeupdate", () => {
        if (Math.abs(video.currentTime - saved) < 1) return;
        saved = video.currentTime;
        local.set(key, String(saved));
      });
      video.addEventListener("pause", () => local.set(key, String(video.currentTime)));
      video.addEventListener("ended", () => local.drop(key));
    }
    show(0);
    goToHash();
  </script>
</body>
</html>
