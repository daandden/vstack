<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; min-inline-size: 0; }
    :root {
      --paper: oklch(98% 0 none);
      --ink: oklch(28% 0.025 265);
      --muted: oklch(45% 0.03 265);
      --link: oklch(42% 0.13 255);
      --rule: color-mix(in oklch, var(--ink) 18%, var(--paper));
      --gutter: clamp(1rem, 0.7rem + 1.5vw, 2rem);
      --section-space: clamp(1.5rem, 1rem + 2vw, 3rem);
      --title-size: clamp(1.75rem, 1.2rem + 2vw, 3rem);
      scrollbar-gutter: stable;
      text-wrap: pretty;
      overflow-wrap: break-word;
      font-synthesis: none;
    }
    body { margin: 0; min-block-size: 100svh; color: var(--ink); background: var(--paper); font-family: system-ui, sans-serif; line-height: 1.6; }
    main {
      display: grid;
      grid-template-columns: [full-start] minmax(var(--gutter), 1fr) [content-start] min(100% - 2 * var(--gutter), 72rem) [content-end] minmax(var(--gutter), 1fr) [full-end];
      padding-block: var(--section-space);
      gap: var(--section-space);
    }
    main > * { grid-column: content; }
    header, section { display: grid; gap: 1rem; }
    :is(header, section) > * { margin-block: 0; }
    h1, h2, h3 { text-wrap: balance; font-weight: 500; line-height: 1.2; }
    h1 { font-size: var(--title-size); }
    p, li { max-inline-size: 75ch; }
    .source, figcaption { color: var(--muted); }
    figure { margin-inline: 0; padding-block: 1rem; border-block: 1px solid var(--rule); }
    figure svg { display: block; max-inline-size: 100%; block-size: auto; }
    figcaption { margin-block-start: 0.75rem; }
    code { font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; }
    a { color: var(--link); text-underline-offset: 0.2em; touch-action: manipulation; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 0.2em; }
    a:active { color: var(--ink); }
    @media (hover: hover) and (pointer: fine) { a:hover { color: var(--muted); } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>{{TITLE}}</h1>
      <p>{{OVERVIEW}}</p>
      <p class="source">{{TARGET_AND_CITATIONS}}</p>
    </header>
    <!-- Replace this marker with complete explanation sections and exported SVG figures, in reading order. -->
    <!-- EXPLANATION_CONTENT -->
  </main>
</body>
</html>
