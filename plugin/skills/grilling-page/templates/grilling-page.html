<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Grilling: {{title}}</title>
  <!-- scripts/grilling-page.ts fills this page. Do not edit a rendered page by hand. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; min-inline-size: 0; }
    :root {
      color-scheme: dark;
      /* Catppuccin Mocha, each hex as oklch. */
      --base: oklch(24.3% 0.030 283.9);
      --mantle: oklch(21.6% 0.025 284.1);
      --surface0: oklch(32.4% 0.032 282.0);
      --surface1: oklch(40.4% 0.032 280.2);
      --overlay0: oklch(55.0% 0.034 277.1);
      --subtext0: oklch(75.1% 0.040 273.9);
      --subtext1: oklch(81.7% 0.040 272.9);
      --text: oklch(87.9% 0.043 272.3);
      --mauve: oklch(78.7% 0.119 304.8);
      --blue: oklch(76.6% 0.111 259.9);
      --lavender: oklch(81.7% 0.091 277.3);
      --yellow: oklch(91.9% 0.070 86.5);
      --peach: oklch(82.4% 0.101 52.6);
      --green: oklch(85.8% 0.109 142.7);
      --red: oklch(75.6% 0.130 2.8);
      --teal: oklch(85.8% 0.079 182.7);
      --pink: oklch(87.0% 0.075 336.3);
      --line: color-mix(in oklch, var(--surface1) 60%, transparent);
      scrollbar-gutter: stable;
      --nav-clearance: 5rem;
      scroll-padding-block-start: var(--nav-clearance);
      /* Three font sizes only: title, body, small. */
      --fs-title: 0.9375rem;
      --fs-body: 0.8125rem;
      --fs-small: 0.75rem;
      text-wrap: pretty;
      overflow-wrap: break-word;
      font-synthesis: none;
    }
    /* Yellow is your answer everywhere: the picked label, the answered dot, and the answer line. */
    [data-state="answered"] { --state: var(--yellow); }
    [data-state="unanswered"] { --state: var(--red); }
    [data-state="open"] { --state: var(--overlay0); }
    [data-state="finished"] { --state: var(--green); }
    [data-state="in-progress"] { --state: var(--peach); }
    [data-state="not-started"] { --state: var(--overlay0); }
    [hidden] { display: none !important; }
    body { margin: 0; min-block-size: 100svh; background: var(--base); color: var(--text); font: var(--fs-body)/normal "IosevkaTerm Nerd Font Mono", "Iosevka Term", "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0; }
    h1, h2, h3, h4 { margin-block: 0; color: var(--text); text-wrap: balance; font-family: "IosevkaTermSlab Nerd Font Mono", "Iosevka Term Slab", "JetBrains Mono", ui-monospace, monospace; font-size: var(--fs-body); line-height: normal; }
    p, ul, ol, dl, dd, figure { margin: 0; }
    a { color: var(--blue); text-underline-offset: 0.2em; touch-action: manipulation; }
    a:active, .terms dt a:active { color: var(--lavender); }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 0.2em; }
    @media (hover: hover) and (pointer: fine) { a:hover, .terms dt a:hover { color: var(--lavender); } }
    code, pre { font: inherit; }
    code { padding-inline: 0.25em; border-radius: 0.2rem; background: var(--surface0); color: var(--text); }
    pre { white-space: pre-wrap; font-size: var(--fs-small); }
    svg, img { display: block; max-inline-size: 100%; block-size: auto; }

    .bar { position: sticky; inset-block-start: 0; z-index: 1; background: var(--mantle); border-block-end: 1px solid var(--line); font-size: var(--fs-small); }
    .tabs, .jump-row { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: center; padding-block: 0.375rem; padding-inline: 1.25rem; }
    .jump-row { border-block-start: 1px solid var(--line); }
    .tabs a, .jump-row a { display: inline-flex; gap: 0.375rem; align-items: center; padding-inline: 0.25rem; border-radius: 0.25rem; color: var(--subtext1); text-decoration: none; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tabs a[aria-selected="true"], .jump-row a[aria-current="true"] { background: var(--surface1); color: var(--mauve); }
    .jump-row .sep { inline-size: 1px; block-size: 1rem; background: var(--surface1); }
    .dot { flex: none; inline-size: 0.4375rem; block-size: 0.4375rem; border-radius: 50%; background: var(--state, var(--overlay0)); }

    main { --content: 100rem; --gutter: 1.25rem; display: grid; grid-template-columns: [full-start] minmax(var(--gutter), 1fr) [content-start] min(calc(100% - var(--gutter) * 2), var(--content)) [content-end] minmax(var(--gutter), 1fr) [full-end]; gap: 1.5rem 0; padding-block: 1rem; }
    main > * { grid-column: content; }
    .stage .pick { color: var(--yellow); }
    .stage .open { color: var(--overlay0); }
    .sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: clip; clip-path: inset(50%); white-space: nowrap; }
    .page-head { display: grid; gap: 0.25rem; }
    .crumb, time, .label { color: var(--subtext0); }
    .crumb, time, .label, .why { font-size: var(--fs-small); }
    h1 { font-size: var(--fs-title); font-weight: 700; }

    .tab, .round { display: grid; gap: 1.5rem; }
    .empty { color: var(--subtext0); }

    .stages { display: grid; gap: 1rem; padding-inline-start: 0; list-style: none; }
    .stage { display: grid; gap: 0.375rem; padding-block-end: 0.75rem; border-block-end: 1px solid var(--line); }
    .stage h3 { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; }
    .stage h3 a { display: inline-flex; gap: 0.5rem; align-items: center; color: var(--mauve); text-decoration: none; }
    .stage .meta { display: inline-flex; gap: 0.75rem; font-size: var(--fs-small); font-weight: 400; color: var(--subtext0); }
    .stage .meta .state { color: var(--state); font-weight: 600; }
    .stage .label { font-weight: 600; }
    .stage ul { display: grid; gap: 0.125rem; padding-inline-start: 1.25rem; }
    .stage li::marker { color: var(--overlay0); }
    .stage li a { font-weight: 600; text-decoration: none; }

    .background { display: grid; gap: 0.625rem; }
    .background > header { display: grid; gap: 0.125rem; }
    .background > header .label { font-weight: 600; text-transform: uppercase; }
    .background h2 { font-size: var(--fs-title); font-weight: 700; text-transform: none; color: var(--text); }
    .background section { display: grid; gap: 0.375rem; }
    .background h3 { font-size: var(--fs-body); color: var(--lavender); }
    .summary-line { color: var(--subtext1); }
    .sources { display: grid; gap: 0.125rem; }
    .sources .label { font-weight: 600; }

    .topic { display: grid; gap: 0.5rem; padding-block-end: 0.75rem; border-block-end: 1px solid var(--line); }
    .topics { display: grid; gap: 0.125rem; }
    .topics a { font-weight: 600; text-decoration: none; }

    .round > header { display: grid; gap: 0.125rem; padding-block-start: 0.5rem; border-block-start: 1px solid var(--surface1); }
    h2 { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; font-size: var(--fs-small); font-weight: 650; text-transform: uppercase; color: var(--subtext0); }
    h2 time { font-weight: 400; text-transform: none; font-variant-numeric: tabular-nums; }

    .question { display: grid; gap: 0.625rem; padding-block-end: 0.5rem; border-block-end: 1px solid var(--line); }
    h3 { font-size: var(--fs-title); font-weight: 650; color: var(--mauve); }
    .qnum { margin-inline-end: 0.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .description { display: grid; gap: 0.5rem; }
    .bullets { display: grid; gap: 0.125rem; padding-inline-start: 1.25rem; }
    .bullets > li::marker { color: var(--overlay0); }
    .example, .today, .terms, .report-links { display: grid; gap: 0.125rem; }
    :is(.example, .today, .terms, .topics, .report-links) > .label { font-weight: 600; color: var(--pink); }
    /* Today lists how things work now, each fact followed by its file and line. */
    .source { color: var(--subtext0); font-size: var(--fs-small); }
    .terms dl, .fields { display: grid; gap: 0.125rem; }
    .terms dt { font-weight: 600; color: var(--teal); }
    .terms dt :is(code, a) { color: inherit; }
    .fields dt { font-size: var(--fs-small); font-weight: 600; color: var(--subtext1); }
    :is(.terms dl, .fields) > dd + dt { margin-block-start: 0.5rem; }
    /* An example can be a list or a screen, so it keeps its line breaks and leading spaces. */
    .example p:not(.label) { white-space: pre-wrap; }

    .visual, .preview { padding-block: 0.625rem; padding-inline: 0.75rem; border-radius: 0.375rem; background: var(--mantle); overflow-x: auto; }
    .visual { display: grid; gap: 0.5rem; }
    .preview { display: grid; gap: 0.375rem; justify-items: start; }

    .options { display: grid; padding-inline-start: 0; list-style: none; }
    .option { display: grid; gap: 0.25rem; padding-block: 0.5rem; }
    h4 { font-weight: 400; color: var(--blue); }
    .option[data-picked] h4 { color: var(--yellow); font-weight: 700; }
    .star { margin-inline-start: 0.5rem; color: var(--yellow); font-weight: 700; }
    .trade { display: grid; padding-inline-start: 0; list-style: none; }
    .trade > li { position: relative; padding-inline-start: 1.25rem; }
    .gain::before, .cost::before { position: absolute; inset-inline-start: 0; font-weight: 700; }
    .gain::before { content: "+"; color: var(--green); }
    .cost::before { content: "\2212"; color: var(--red); }
    .why { color: var(--subtext0); }

    .answer { display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; align-items: baseline; color: var(--text); }
    .answer > .label { font-weight: 600; color: var(--state); }

    .summary { display: grid; gap: 0.5rem; }
    .decisions { display: grid; gap: 0.25rem; padding-inline-start: 1.25rem; }
    .decisions > li::marker { color: var(--overlay0); }
    .decisions a { font-weight: 600; text-decoration: none; }

    .report { display: grid; gap: 0.75rem; }
    .report > header { display: grid; gap: 0.25rem; padding-block-start: 0.5rem; border-block-start: 1px solid var(--surface1); }
    .report-summary { color: var(--subtext1); }
    .report .entries { display: grid; gap: 0.75rem; padding-inline-start: 0; list-style: none; }
    .card, .claim { display: grid; gap: 0.375rem; padding-block-end: 0.5rem; border-block-end: 1px solid var(--line); }
    .card:last-child, .claim:last-child { padding-block-end: 0; border-block-end: none; }
    .entry-id { margin-inline-end: 0.5rem; font-weight: 700; font-variant-numeric: tabular-nums; text-transform: uppercase; }
    .report-links .entry-id { margin-inline-end: 0; }
    .tag { color: var(--subtext0); font-size: var(--fs-small); font-weight: 600; }
    .card[data-blocking] .tag { color: var(--red); }
    [data-status="confirmed"] { --state: var(--red); }
    [data-status="cleared"] { --state: var(--green); }
    [data-status="unproven"] { --state: var(--peach); }
    .claim .tag { color: var(--state); }
    .report .ask { display: grid; gap: 0.125rem; }
    .report .ask .label { font-weight: 600; }
    .report .ask a, .report td a { font-weight: 600; text-decoration: none; }
    .report .table { overflow-x: auto; }
    .report table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .report th, .report td { padding-block: 0.25rem; padding-inline: 0.5rem; border-block-end: 1px solid var(--line); text-align: start; vertical-align: top; }
    .report th { color: var(--subtext0); font-size: var(--fs-small); font-weight: 600; }
    .card:target, .claim:target, .report tr:target { background: var(--surface0); }
  </style>
</head>
<body>
<!-- NAV -->
  <main>
<!-- BODY -->
  </main>
  <script>
    const bar = document.querySelector(".bar");
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = tabs.map((t) => document.getElementById(t.getAttribute("aria-controls")));
    const pad = () => (bar ? bar.offsetHeight : 0) + 8;
    const setClearance = () => document.documentElement.style.setProperty("--nav-clearance", `${pad()}px`);
    if (bar) new ResizeObserver(setClearance).observe(bar);
    setClearance();
    let open = 0;
    let stops = [];
    let current = -1;
    function mark(i) {
      current = i;
      const id = stops[i]?.id;
      document.querySelectorAll(".jump-row a[data-for]").forEach((a) => a.setAttribute("aria-current", String(a.dataset.for === id)));
    }
    function show(t) {
      open = t;
      tabs.forEach((tab, n) => tab.setAttribute("aria-selected", String(n === t)));
      panels.forEach((p, n) => { p.hidden = n !== t; });
      document.querySelectorAll(".jump-row[data-tab]").forEach((row) => { row.hidden = row.dataset.tab !== panels[t].id; });
      setClearance();
      stops = [...panels[t].querySelectorAll("[data-stop]")];
      mark(-1);
    }
    function openTab(t) {
      show(t);
      history.replaceState(null, "", `#${panels[t].id}`);
      scrollTo({ top: 0, behavior: "instant" });
    }
    function reveal(id) {
      const el = id ? document.getElementById(id) : null;
      const t = el ? panels.findIndex((p) => p.contains(el)) : -1;
      if (t >= 0 && t !== open) show(t);
      return t >= 0 ? el : null;
    }
    function markFromScroll() {
      let i = -1;
      stops.forEach((s, n) => { if (s.getBoundingClientRect().top <= pad() + 2) i = n; });
      const atEnd = scrollY + innerHeight >= document.documentElement.scrollHeight - 2;
      const pickedStopStillOnScreenAtEnd = atEnd && current > i && stops[current].getBoundingClientRect().top < innerHeight;
      if (pickedStopStillOnScreenAtEnd) i = current;
      mark(i);
    }
    function jump(i) {
      if (i < 0 || i >= stops.length) return;
      stops[i].scrollIntoView({ block: "start", behavior: "instant" });
      mark(i);
    }
    addEventListener("click", (e) => {
      const a = e.target.closest?.('a[href^="#"]');
      if (!a) return;
      const t = tabs.indexOf(a);
      if (t >= 0) {
        e.preventDefault();
        openTab(t);
        return;
      }
      const id = decodeURIComponent(a.getAttribute("href").slice(1));
      reveal(id);
      const i = stops.findIndex((s) => s.id === id);
      if (i >= 0) mark(i);
    });
    function goToHash() {
      const el = reveal(decodeURIComponent(location.hash.slice(1)));
      if (!el) return;
      el.scrollIntoView({ block: "start", behavior: "instant" });
      if (stops.includes(el)) mark(stops.indexOf(el));
    }
    addEventListener("hashchange", goToHash);
    addEventListener("scroll", markFromScroll, { passive: true });
    addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
      if (e.key === "n") {
        const first = document.querySelector(".question[data-open]");
        if (first) {
          e.preventDefault();
          reveal(first.id);
          history.replaceState(null, "", `#${first.id}`);
          jump(stops.indexOf(first));
        }
        return;
      }
      if ((e.key === "h" || e.key === "ArrowLeft") && open > 0) { e.preventDefault(); openTab(open - 1); }
      else if ((e.key === "l" || e.key === "ArrowRight") && open < tabs.length - 1) { e.preventDefault(); openTab(open + 1); }
      else if (!stops.length) return;
      else if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); jump(current + 1); }
      else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); jump(Math.max(current - 1, 0)); }
    });
    show(0);
    goToHash();
  </script>
</body>
</html>
